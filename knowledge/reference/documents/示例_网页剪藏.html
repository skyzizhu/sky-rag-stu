        <h1>知了笔记 2.0 正式发布：全新知识图谱视图上线</h1>
        <p class="date">发布日期：2026 年 8 月 18 日</p>

        <h2>版本亮点</h2>
        <p>知了笔记 2.0 于 2026 年 8 月 18 日正式发布。本次更新最大的亮点是全新的
        知识图谱视图：笔记之间的双向链接会自动生成可视化关系网，用户可以像逛地图
        一样在知识点之间漫游。</p>

        <h2>价格调整</h2>
        <p>2.0 版本起，专业版订阅价格调整为每月 25 元，年费 228 元。
        老用户续费享受 8 折优惠，活动持续到 2026 年 9 月 30 日。</p>

        <h2>已知问题</h2>
        <p>部分 macOS 用户反馈导入 Evernote 备份时图片丢失，官方确认将在 2.0.1
        小版本修复，预计 9 月上旬推送。</p>

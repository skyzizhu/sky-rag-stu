async function renderIngestLog() {
  const requestId = ++ingestLogRequest;
  const qs = new URLSearchParams({ page: ingestFilter.page });
  for (const key of ['username', 'keyword', 'entry', 'outcome', 'batch_id']) {
    if (ingestFilter[key]) qs.set(key, ingestFilter[key]);
  }
  if (ingestFilter.period) {
    qs.set('since', ingestFilter.period.since);
    qs.set('before', ingestFilter.period.before);
  } else {
    if (ingestFilter.start) qs.set('since', new Date(`${ingestFilter.start}T00:00:00`).toISOString());
    if (ingestFilter.end) {
      const day = new Date(`${ingestFilter.end}T00:00:00`);
      day.setDate(day.getDate() + 1);
      qs.set('before', day.toISOString());
    }
  }
  const d = await api('GET', '/api/logs/ingest?' + qs);
  if (current !== 'ingestlog' || requestId !== ingestLogRequest) return;
  ingestFilter.page = d.page;
  ingestRows = new Map(d.logs.map(row => [row.id, row]));
  ingestDepartmentLabels = new Map(Object.entries(d.department_labels || {}));
  const options = (labels, key) => Object.entries(labels).map(([value, label]) =>
    `<option value="${value}" ${ingestFilter[key] === value ? 'selected' : ''}>${label}</option>`).join('');
  const employeeOptions = (d.employee_options || []).map(({ username, real_name }) => {
    const name = real_name.trim();
    const label = name ? `${username} - ${name}` : username;
    return `<option value="${esc(username)}" ${ingestFilter.username === username ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');
  const rows = d.logs.map(l => `<tr>
    <td class="muted">${esc(new Date(l.started_at).toLocaleString())}</td>
    <td><b>${esc(l.username) || '—'}</b><br><span class="muted">${esc(l.actor_department)}</span></td>
    <td class="wrap"><b>${esc(l.file_name) || '—'}</b>
      ${l.can_reveal ? `<button type="button" class="ingest-path" title="在文件管理器中打开位置" onclick="revealIngestFile(${l.id})">${esc(l.absolute_path)}</button>`
        : `<span class="ingest-path muted">${esc(l.absolute_path || l.path || l.source_path)}</span>`}</td>
    <td class="wrap">${esc(l.attributes.business_direction) || '—'}</td>
    <td class="wrap">${esc(ingestProject(l.attributes)) || '—'}</td>
    <td class="wrap">${esc(l.attributes.department) || '—'}</td>
    <td class="wrap">${ingestAccess(l.attributes, 2)}</td>
    <td>${ingestOutcome(l)}
      <br><span class="muted">${esc(ingestReasons[l.reason] || '')}</span></td>
    <td><button type="button" class="mini secondary" onclick="showIngestDetail(${l.id})">查看</button></td>
  </tr>`).join('');
  $('#view').innerHTML = `<div class="card">
    <h3>入库文件</h3>
    <div class="toolbar">
      <select aria-label="按员工账户筛选" onchange="ingestFilterChange('username', this.value)">
        <option value="">全部员工</option>${employeeOptions}</select>
      <input aria-label="文件名或路径" placeholder="搜索文件名或路径" maxlength="256" value="${esc(ingestFilter.keyword)}" onchange="ingestFilterChange('keyword', this.value.trim())">
      <select aria-label="入库入口" onchange="ingestFilterChange('entry', this.value)"><option value="">全部入口</option>${options(ingestEntries, 'entry')}</select>
      <select aria-label="入库结果" onchange="ingestFilterChange('outcome', this.value)"><option value="">全部结果</option>${options(ingestOutcomes, 'outcome')}</select>
      <label>起始日期 <input type="date" value="${esc(ingestFilter.start)}" onchange="ingestFilterChange('start', this.value)"></label>
      <label>截止日期 <input type="date" value="${esc(ingestFilter.end)}" onchange="ingestFilterChange('end', this.value)"></label>
      <button class="mini secondary" onclick="ingestFilterChange('page', 1)">刷新</button>
      ${ingestFilter.batch_id ? `<button class="mini secondary" onclick="ingestFilterChange('batch_id', '')">清除批次筛选</button>` : ''}
    </div>
    ${!d.reveal_available && d.logs.some(l => l.absolute_path) ? '<p class="muted">在知识库所在电脑通过 localhost 打开管理后台，即可定位文件。</p>' : ''}
    <div style="overflow-x:auto"><table><tr><th>开始时间</th><th>员工</th><th>文件与路径</th><th>业务方向</th>
      <th>项目</th><th>归属部门</th><th title="本次入库记录中的实际可见范围">检索权限</th><th>结果</th><th>详情</th></tr>
      ${rows || '<tr><td colspan="9" class="empty">暂无符合条件的入库日志</td></tr>'}
    </table></div>
    <div class="toolbar" style="margin-top:12px">

let lastToken = '';
async function tokenCreate(ev) {
  ev.preventDefault();
  const f = ev.target;
  try {
    const r = await api('POST', '/api/tokens', { username: f.username.value,
                                                 name: f.name.value.trim() });
    lastToken = r.plaintext;
    toast('令牌已签发，请立即复制保存');
    renderTokens();
  } catch (e) { toast(e.message, false); }
  return false;
}
async function tokenRevoke(prefix) {
  confirmDo('吊销令牌', `确认吊销令牌 ${prefix}…？该 Agent 接入将立即失效。`,
    async () => { await api('POST', '/api/tokens/revoke?token_prefix=' + encodeURIComponent(prefix));
                  toast('令牌已吊销'); renderTokens(); }, '吊销', true);
}
/* 剪贴板复制：优先 Clipboard API，非安全上下文（如 http://局域网IP 访问）降级 execCommand */
function copyText(text, note, container) {
  const done = () => toast(note || '已复制到剪贴板');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done, container));
    return;
  }
  fallbackCopy(text, done, container);
}
function fallbackCopy(text, done, container) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  const active = document.activeElement;
  (container || active?.closest('dialog[open]') || document.body).appendChild(ta);
  ta.focus(); ta.select();
  try {
    if (!document.execCommand('copy')) throw new Error('copy failed');
    done();
  } catch (e) { toast('复制失败，请手动选择文本复制', false); }
  ta.remove();
  if (active instanceof HTMLElement) active.focus();
}

    <td class="wrap">${esc(l.detail) || '—'}</td>

    <td><details><summary>查看</summary><div class="log-detail">指纹：${esc(l.fingerprint)}<br>UA：${esc(l.user_agent)}</div></details></td>
  </tr>`).join('');
  $('#view').innerHTML = `<div class="card">
    <h3>管理员登录日志（共 ${d.total} 条）</h3>
    <div class="toolbar">
      <input aria-label="管理员账户" placeholder="按管理员账户筛选" value="${esc(adminLoginFilter.username)}"
        onchange="adminLoginChange('username', this.value.trim())">
      <select aria-label="登录动作" onchange="adminLoginChange('action', this.value)">
        <option value="">全部登录 / 登出</option>
        ${['login', 'logout'].map(a => `<option value="${a}" ${a === adminLoginFilter.action ? 'selected' : ''}>${actionLabel(a)}</option>`).join('')}
      </select>
      <button class="mini secondary" onclick="renderAdminLoginLog().catch(e => toast(e.message, false))">刷新</button>
    </div>
    <div class="muted" style="margin-bottom:10px">仅显示管理员登录、登出及登录失败记录；新增、编辑、删除等行为在「管理员操作日志」中查看。</div>
    <div style="overflow-x:auto"><table><tr><th>时间</th><th>管理员账户</th><th>动作</th><th>结果</th><th>说明</th><th>设备</th><th>IP</th><th>详情</th></tr>
      ${rows || '<tr><td colspan="8" class="empty">暂无符合条件的管理员登录日志</td></tr>'}
    </table></div>
    <div class="toolbar" style="margin-top:12px">
      <button class="mini secondary" ${d.page <= 1 ? 'disabled' : ''} onclick="adminLoginChange('page', adminLoginFilter.page - 1)">上一页</button>
      <span class="muted">第 ${d.page} / ${d.total_pages} 页，共 ${d.total} 条</span>
      <button class="mini secondary" ${d.page >= d.total_pages ? 'disabled' : ''} onclick="adminLoginChange('page', adminLoginFilter.page + 1)">下一页</button>
      <select aria-label="每页条数" onchange="adminLoginChange('page_size', +this.value)">
        ${[20, 50, 100].map(n => `<option value="${n}" ${n === adminLoginFilter.page_size ? 'selected' : ''}>每页 ${n} 条</option>`).join('')}
      </select>
    </div>
  </div>`;
}

/* ---------- 员工登录日志 ---------- */
let authLogFilter = { username: '', action: '', page: 1 };
const AUTH_PAGE_SIZE = 20;
async function renderAuthLog() {
  const qs = new URLSearchParams();
  qs.set('scope', 'users');
  qs.set('page', authLogFilter.page);
  qs.set('limit', AUTH_PAGE_SIZE);
  if (authLogFilter.username) qs.set('username', authLogFilter.username);
  if (authLogFilter.action) qs.set('action', authLogFilter.action);
  const d = await api('GET', '/api/logs/auth?' + qs.toString());
  authLogFilter.page = d.page;
  const totalPages = d.total_pages;
  const rows = d.logs.map(l => `
    <tr class="clickable" onclick="this.nextElementSibling.classList.toggle('hidden')">
      <td class="muted">${esc(l.created_at)}</td>
      <td><b>${esc(l.username) || '—'}</b></td>
      <td>${actionLabel(l.action)}</td>
      <td>${l.success ? '<span class="tag on">成功</span>'
                      : '<span class="tag off">失败</span>'}</td>
      <td class="wrap">${esc(l.detail) || '—'}</td>
      <td>${esc(l.department) || '—'}</td>
      <td>${l.entry === 'admin' ? '<span class="tag neutral">管理后台</span>'
                                : '<span class="tag neutral">前台</span>'}</td>
      <td class="muted">${esc(l.ip || '—')}</td>
    </tr>
    <tr class="hidden"><td colspan="8">
      <div class="log-detail">🖥 ${esc(l.browser)} / ${esc(l.os_name)}
        ｜ 指纹 <span class="mono">${esc(l.fingerprint)}</span>
        ｜ UA ${esc(l.user_agent) || '—'}</div>
    </td></tr>`).join('');
  $('#view').innerHTML = `
    <div class="card">
      <h3>员工登录日志（共 ${d.total} 条）</h3>
      <div class="toolbar">
        <input class="wide" placeholder="按账户过滤…" value="${esc(authLogFilter.username)}"
          onchange="authLogFilter.username=this.value; authLogFilter.page=1; renderAuthLog()">
        <select onchange="authLogFilter.username=this.value; authLogFilter.page=1; renderAuthLog()">
          <option value="">全部员工</option>
          ${(await api('GET', '/api/users')).users
            .map(u => `<option value="${esc(u.username)}" ${u.username === authLogFilter.username
              ? 'selected' : ''}>${esc(u.username)}${u.real_name ? '（' + esc(u.real_name) + '）' : ''}</option>`).join('')}
        </select>
        <select onchange="authLogFilter.action=this.value; authLogFilter.page=1; renderAuthLog()">
          <option value="">全部动作</option>
          ${['login','logout','register','bootstrap_admin','password_reset',
             'employee_create','employee_toggle','employee_transfer',
             'department_create','department_toggle','department_delete',
             'token_create','token_revoke']
            .map(a => `<option value="${a}" ${a === authLogFilter.action
              ? 'selected' : ''}>${actionLabel(a)}</option>`).join('')}
        </select>
        <button class="mini secondary" onclick="renderAuthLog()">刷新</button>
      </div>
      <div class="muted" style="margin-bottom:10px">本页只记录<b>员工</b>的登录与相关操作
        （管理员登录日志在「日志 → 管理员登录日志」中查看）。IP 为浏览器真实局域网地址（登录门已直连认证服务获取）。
        点击任意行展开浏览器指纹与完整 UA，失败的登录尝试同样完整保留（含原因）。</div>
      <table><tr><th>时间</th><th>账户</th><th>动作</th><th>结果</th><th>说明</th>
        <th>部门</th><th>入口</th><th>IP</th></tr>
      ${rows || '<tr><td colspan="8" class="empty">暂无登录日志</td></tr>'}</table>
      <div class="pager" style="display:flex;gap:8px;align-items:center;margin:10px 0 0">
        <button class="mini secondary" ${authLogFilter.page <= 1 ? 'disabled' : ''}
          onclick="authLogFilter.page--; renderAuthLog()">上一页</button>
        <span class="muted">第 ${authLogFilter.page} / ${totalPages} 页（共 ${d.total} 条）</span>
        <button class="mini secondary" ${authLogFilter.page >= totalPages ? 'disabled' : ''}
          onclick="authLogFilter.page++; renderAuthLog()">下一页</button>

}
function actionLabel(a) {
  const m = { login: '登录', logout: '登出', register: '注册',
    bootstrap_admin: '初始化管理员', password_reset: '重置密码',
    permissions_update: '分配前台权限',
    employee_create: '创建员工', employee_toggle: '停用/启用员工',
    employee_transfer: '调整部门', department_create: '创建部门',
    department_toggle: '停用/启用部门', department_delete: '删除部门',
    business_direction_create: '创建业务方向',
    project_create: '创建项目', project_update: '编辑项目',
    admin_create: '新增管理员', admin_delete: '删除管理员',
    token_create: '签发令牌', token_revoke: '吊销令牌' };
  return m[a] || a;
}

/* ---------- 云端 LLM 费用（V3.9：qa_logs.usage × 模型单价） ---------- */
let llmCostFilter = { days: 30, page: 1, username: '', entry: null };
let llmCostRequest = 0;
const LLM_PAGE_SIZE = 20;
function llmCostEntryName(entry) {
  return entry === '' ? '未记录入口（历史）' : Object.prototype.hasOwnProperty.call(qaEntryLabel, entry) ? qaEntryLabel[entry] : entry;
}
function llmCostChange(field, value) {
  llmCostFilter[field] = value; llmCostFilter.page = 1;
  renderLlmCost().catch(e => toast(e.message, false));
}
function llmCostPage(page) {
  llmCostFilter.page = page;
  renderLlmCost().catch(e => toast(e.message, false));
}
async function renderLlmCost() {
  const request = ++llmCostRequest, filter = {...llmCostFilter};
  const qs = new URLSearchParams();
  qs.set('days', filter.days);
  qs.set('page', filter.page);
  qs.set('page_size', LLM_PAGE_SIZE);
  if (filter.username) { qs.set('username', filter.username); qs.set('username_exact', 'true'); }
  if (filter.entry !== null) qs.set('entry', filter.entry);
  const d = await api('GET', '/api/llm/costs?' + qs.toString());
  if (request !== llmCostRequest || current !== 'llmcost') return;
  llmCostFilter.page = d.page;
  const t = d.totals, p = d.prices;
  const daysSel = [0, 7, 30, 90].map(v =>
    `<option value="${v}" ${filter.days === v ? 'selected' : ''}>${v === 0 ? '全部' : '最近 ' + v + ' 天'}</option>`).join('');
  const usersSel = (d.filters?.users || []).map(u => `<option value="${esc(u.username)}" ${filter.username === u.username ? 'selected' : ''}>${esc(u.username)}${u.real_name ? '（' + esc(u.real_name) + '）' : ''}</option>`).join('');
  const entries = [...new Set([...Object.keys(qaEntryLabel), ...(d.filters?.entries || [])])];
  const entriesSel = [null, ...entries].map(entry => `<option value="${esc(JSON.stringify(entry))}" ${filter.entry === entry ? 'selected' : ''}>${entry === null ? '全部' : esc(llmCostEntryName(entry))}</option>`).join('');
  const rows = d.rows.map(r => `
    <tr>
      <td class="muted">${esc(r.created_at)}</td>
      <td><b>${esc(r.username) || '—'}</b></td>
      <td><span class="tag neutral">${esc(llmCostEntryName(r.entry))}</span></td>
      <td class="wrap">${esc(r.question)}</td>
      <td>${r.input.toLocaleString()}<span class="muted">（缓存 ${r.input_cached.toLocaleString()}）</span></td>
      <td>${r.output.toLocaleString()}</td>
      <td>${r.calls}</td>
      <td>${r.estimated ? '<span class="muted">≈</span>' : ''}</td>
      <td><b>${r.cost.toFixed(4)}</b> 元</td>
    </tr>`).join('');
  const totalPages = Math.max(1, d.total_pages);
  const cur = Math.min(d.page, totalPages);
  let pages = '';
  for (let i = 1; i <= totalPages; i++) {
    if (totalPages > 9 && i > 2 && i < totalPages - 1 && Math.abs(i - cur) > 1) {
      if (!pages.endsWith('…')) pages += '<span class="muted">…</span>';
      continue;
    }
    pages += `<button class="${i === cur ? 'current' : ''}" ${i === cur ? 'disabled' : ''}
      onclick="llmCostPage(${i})">${i}</button>`;
  }
  const prev = `<button ${cur <= 1 ? 'disabled' : ''}
    onclick="llmCostPage(${cur - 1})">‹ 上一页</button>`;
  const next = `<button ${cur >= totalPages ? 'disabled' : ''}
    onclick="llmCostPage(${cur + 1})">下一页 ›</button>`;
  $('#view').innerHTML = `
    <h3>云端 LLM 消耗与费用（仅云上模型；本地模型不计费）</h3>
    <div class="toolbar">
      <label>统计范围：<select aria-label="LLM费用统计范围" onchange="llmCostChange('days', +this.value)">${daysSel}</select></label>
      <label>用户：<select aria-label="LLM费用用户" onchange="llmCostChange('username', this.value)">
        <option value="" ${!filter.username ? 'selected' : ''}>全部</option>${usersSel}</select></label>
      <label>入口：<select aria-label="LLM费用入口" onchange="llmCostChange('entry', JSON.parse(this.value))">${entriesSel}</select></label>
    </div>
    <div class="muted">以下汇总覆盖当前用户、入口及日期范围内的全部匹配记录，翻页不改变汇总。</div>
    <div class="cost-cards">
      <div class="cost-card"><div class="label">调用次数</div>
        <div class="value">${t.calls}</div></div>
      <div class="cost-card"><div class="label">输入 tokens</div>
        <div class="value">${t.input.toLocaleString()}</div>
        <div class="sub">其中命中缓存 ${t.input_cached.toLocaleString()}</div></div>
      <div class="cost-card"><div class="label">输出 tokens</div>
        <div class="value">${t.output.toLocaleString()}</div></div>
      <div class="cost-card highlight"><div class="label">总费用</div>
        <div class="value">${t.cost.toFixed(2)} 元</div></div>
    </div>
    <div class="muted" style="margin:4px 0 10px">单价（元/百万 tokens）：
      输入 ${p.input} ｜ 命中缓存 ${p.input_cached} ｜ 输出 ${p.output}
      —— 在前台「模型配置」页修改</div>
    <table class="data-table">
      <thead><tr>
        <th>时间</th><th>用户</th><th>入口</th><th>问题</th>
        <th>输入 tokens</th><th>输出 tokens</th><th>调用次数</th><th>估算</th><th>费用（元）</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="9" class="empty">所选范围内没有云端 LLM 消耗记录</td></tr>'}</tbody>
    </table>
    <div class="cost-page">
      ${prev}
      ${pages}
      ${next}
      <span class="info">第 ${cur} / ${totalPages} 页 ｜ 共 ${d.total_rows} 条记录</span>
    </div>`;
}

/* ---------- RAG 使用日志（只有员工会产生——管理员不能登录前台/MCP） ---------- */
let qaLogFilter = { username: '', entry: '', department: '', page: 1 };
let qaLogRequest = 0;
let qaLogRows = new Map();
const QA_PAGE_SIZE = 20;
const qaEntryLabel = { web: '知识库问答', manage_summary: '跨文档总结',
                       mcp_http: 'MCP（团队）', mcp_stdio: 'MCP（个人）' };

function showQaLogDetail(id) {
  const row = qaLogRows.get(id);
  if (!row) return;
  const sources = Array.isArray(row.sources) ? row.sources : [];
  const body = $('#qa-log-detail-body');
  const field = (label, value) => `<section class="qa-detail-field"><h4>${label}</h4><div class="log-detail">${esc(value)}</div></section>`;
  const context = row.mcp_context || {};
  const inputLabels = {project_and_history: '项目和历史', project: '项目参数', history: '相关历史',
                       question: '本轮问题', missing: '缺少指代上下文'};
  const sourceLabels = {project_argument: '项目参数', history: '历史消息', question: '本轮问题',
                        business_direction: '业务方向', none: '无'};
  body.innerHTML = `<div class="muted">${esc(row.created_at)} · ${esc(row.username) || '—'} · ${esc(row.department) || '—'} · ${esc(qaEntryLabel[row.entry] || row.entry)}</div>
    <p><b>命中个数</b> ${sources.length} 个来源 <span class="muted">·</span> <b>耗时</b> ${esc(row.elapsed.toFixed(1))} 秒</p>
    ${field('问题', row.question)}
    ${field('回答', row.answer || '（仅检索，无生成）')}
    ${row.answer?.length >= 3000 ? '<div class="muted">回答预览最多显示 3000 个字符。</div>' : ''}
    ${field('命中来源', sources.map(item => item?.path || item?.source).filter(Boolean).join('、') || '无')}
    ${field('过滤条件', JSON.stringify(row.filters || {}, null, 2))}
    ${context.tool ? field('MCP 上下文', [
      `工具 ${context.tool}`,
      `入参 ${inputLabels[context.input_mode] || '—'}`,
      `采用历史 ${context.history_count} 条`,
      `项目范围来源 ${sourceLabels[context.project_source] || '—'}`,
      ...(context.scope_issue ? [`范围状态 ${context.scope_issue}`] : [])
    ].join(' · ')) : ''}`;
  $('#qa-log-detail').showModal();
  body.scrollTop = 0;
}

async function renderQaLog() {
  const requestId = ++qaLogRequest;
  const qs = new URLSearchParams();
  qs.set('page', qaLogFilter.page);
  qs.set('limit', QA_PAGE_SIZE);
  if (qaLogFilter.username) qs.set('username', qaLogFilter.username);
  if (qaLogFilter.entry) qs.set('entry', qaLogFilter.entry);
  if (qaLogFilter.department) qs.set('department', qaLogFilter.department);
  const [d, { users }, { departments }] = await Promise.all([
    api('GET', '/api/logs/qa?' + qs.toString()), api('GET', '/api/users'), api('GET', '/api/departments'),
  ]);
  if (current !== 'qalog' || requestId !== qaLogRequest) return;
  qaLogRows = new Map(d.logs.map(row => [row.id, row]));
  const totalPages = Math.max(1, Math.ceil(d.total / QA_PAGE_SIZE));
  const rows = d.logs.map(l => `
    <tr class="clickable" onclick="showQaLogDetail(${l.id})">
      <td class="muted">${esc(l.created_at)}</td>
      <td><b>${esc(l.username) || '—'}</b></td>
      <td>${esc(l.department) || '—'}</td>
      <td><span class="tag neutral">${esc(qaEntryLabel[l.entry] || l.entry)}</span></td>
      <td class="wrap">${esc(l.question)}</td>
      <td class="muted">${l.elapsed.toFixed(1)}s</td>
      <td><button type="button" class="mini secondary" onclick="event.stopPropagation(); showQaLogDetail(${l.id})">查看</button></td>
    </tr>`).join('');
  $('#view').innerHTML = `
    <div class="card">
      <h3>员工检索日志—— 共 ${d.total} 条</h3>
      <div class="toolbar">
        <select onchange="qaLogFilter.department=this.value; qaLogFilter.page=1; renderQaLog()">
          <option value="">全部部门</option>
          ${departments
            .map(x => `<option value="${esc(x.name)}" ${x.name === qaLogFilter.department
              ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select>
        <select onchange="qaLogFilter.username=this.value; qaLogFilter.page=1; renderQaLog()">
          <option value="">全部员工</option>
          ${users.map(u => `<option value="${esc(u.username)}" ${u.username === qaLogFilter.username
            ? 'selected' : ''}>${esc(u.username)}${u.real_name ? '（' + esc(u.real_name) + '）' : ''}</option>`).join('')}
        </select>
        <select onchange="qaLogFilter.entry=this.value; qaLogFilter.page=1; renderQaLog()">
          <option value="">全部入口</option>
          ${Object.keys(qaEntryLabel).map(k =>
            `<option value="${k}" ${k === qaLogFilter.entry ? 'selected' : ''}>${qaEntryLabel[k]}</option>`).join('')}
        </select>
        <button class="mini secondary" onclick="renderQaLog()">刷新</button>
      </div>
      <div class="muted" style="margin-bottom:10px">只有员工会产生使用记录（管理员不能登录前台/MCP）。
        点击「查看」可查看回答、命中来源和生效的过滤条件。</div>
      <table><tr><th>时间</th><th>账户</th><th>部门</th><th>入口</th><th>问题</th><th>耗时</th><th>详情</th></tr>
      ${rows || `<tr><td colspan="7" class="empty">暂无使用记录</td></tr>`}</table>
      <div class="pager" style="display:flex;gap:8px;align-items:center;margin:10px 0 0">
        <button class="mini secondary" ${qaLogFilter.page <= 1 ? 'disabled' : ''}
          onclick="qaLogFilter.page--; renderQaLog()">上一页</button>
        <span class="muted">第 ${qaLogFilter.page} / ${totalPages} 页（共 ${d.total} 条）</span>
        <button class="mini secondary" ${qaLogFilter.page >= totalPages ? 'disabled' : ''}
          onclick="qaLogFilter.page++; renderQaLog()">下一页</button>
      </div>
    </div>`;
}

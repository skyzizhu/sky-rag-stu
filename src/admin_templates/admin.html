<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG管理后台 · 长城互联网</title>
<link rel="icon" type="image/svg+xml" href="/static/gw_admin_icon.svg">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f4f6fb; color: #1e2430;
         display: flex; min-height: 100vh; }
  .sidebar { width: 224px; flex-shrink: 0; background: #2b3a67; color: #fff;
             display: flex; flex-direction: column; padding: 18px 12px 14px;
             position: sticky; top: 0; height: 100vh; }
  .sidebar .brand { font-weight: 700; font-size: 15px; padding: 4px 10px 16px;
                    border-bottom: 1px solid rgba(255,255,255,.12); line-height: 1.5; }
  .sidebar .brand span { display: block; font-size: 12px; font-weight: 400; color: #cdd6f0; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; overflow-y: auto; }
  .sidebar nav button { text-align: left; background: transparent; color: #cdd6f0;
                        border: 0; font-size: 14px; padding: 9px 14px;
                        border-radius: 8px; cursor: pointer; }
  .sidebar nav button.active { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
  .sidebar nav button:hover { color: #fff; }
  .sidebar .nav-submenu { display: flex; flex-direction: column; gap: 3px; }
  .sidebar .nav-submenu[hidden] { display: none; }
  .sidebar .nav-submenu button { padding-left: 28px; font-size: 13px; white-space: normal; }
  .sidebar .nav-group { display: flex; justify-content: space-between; align-items: center; }
  .sidebar .spacer { flex: 1; }
  .sidebar .who { font-size: 12.5px; color: #cdd6f0; padding: 12px 10px 0;
                  border-top: 1px solid rgba(255,255,255,.12); line-height: 1.9; }
  .sidebar .who b { color: #fff; }
  .sidebar .who a { color: #fff; cursor: pointer; display: inline-block; }
  main { flex: 1; min-width: 0; padding: 22px 26px 60px; }
  .page-title { margin: 0 0 14px; font-size: 17px; }
  .stats { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 160px; background: #fff; border: 1px solid #e3e8f2;
          border-radius: 10px; padding: 12px 16px; cursor: default; }
  .stat b { font-size: 24px; display: block; }
  .stat span { color: #5a6478; font-size: 12px; }
  .card { background: #fff; border: 1px solid #e3e8f2; border-radius: 10px;
          padding: 16px 18px; margin-bottom: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid #ccd3e0;
                                    border-radius: 7px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #edf0f6; text-align: left;
           vertical-align: middle; white-space: nowrap; }
  th { color: #5a6478; font-weight: 600; background: #f8f9fd; position: sticky; top: 0; }
  td.wrap { white-space: normal; max-width: 340px; }
  .ingest-path { display: block; white-space: normal; overflow-wrap: anywhere; margin-top: 3px; }
  button.ingest-path { padding: 0; background: transparent; color: #2453b3; text-decoration: underline;
                       text-align: left; font-size: 12px; }
  .ingest-access { display: grid; justify-items: start; gap: 4px; }
  .ingest-access-scope { max-width: 200px; overflow-wrap: anywhere; }
  .ingest-access .tag, .ingest-access-scope { white-space: normal; }
  form.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  input, select, textarea { padding: 7px 10px; border: 1px solid #ccd3e0; border-radius: 7px; font-size: 13.5px; }
  input.wide { width: 260px; }
  button { padding: 7px 14px; border: 0; border-radius: 7px; background: #3d5af1;
           color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button.secondary { background: #eaf1ff; color: #2453b3; border: 1px solid #b8cef2; }
  button.secondary:not(:disabled):hover { background: #dce8ff; border-color: #86a9e6; }
  button:focus-visible { outline: 3px solid #a9c3ff; outline-offset: 2px; }
  button.danger { background: #d64545; }
  button.ghost { background: transparent; color: #3d5af1; border: 1px solid #c3cdF5; }
  button.mini { padding: 4px 10px; font-size: 12.5px; }
  button:disabled { background: #edf0f5; color: #8993a4; border: 1px solid #d9dfe8; opacity: 1; cursor: not-allowed; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.on  { background: #e6f7e9; color: #176b32; }
  .tag.off { background: #fdeaea; color: #a12622; }
  .tag.admin { background: #eceafe; color: #4534ae; }
  .tag.neutral { background: #eef1f8; color: #45516b; }
  .muted { color: #8a93a6; font-size: 12px; }
  .toasts { position: fixed; right: 18px; bottom: 18px; display: flex;
            flex-direction: column; gap: 8px; z-index: 99; }
  .toast { padding: 10px 16px; border-radius: 9px; font-size: 13.5px; color: #fff;
           max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,.18); word-break: break-all; }
  .toast.ok { background: #1f9d55; } .toast.err { background: #d64545; }
  dialog { border: 0; border-radius: 12px; padding: 22px 24px; width: 420px; }
  dialog:has(#business-edit-form) { width: 600px; max-width: calc(100vw - 48px); }
  .log-dialog { width: 760px; max-width: calc(100vw - 32px); max-height: 84vh; box-sizing: border-box;
                   padding: 0; overflow: hidden; background: #f7f9fd; color: #26344d;
                   box-shadow: 0 24px 72px #141c5038; }
  .log-dialog[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .log-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                          padding: 15px 22px; background: #fff; border-bottom: 1px solid #e3e8f2; }
  .log-dialog-header h3 { margin: 0; color: #24375d; }
  .log-dialog-header form { margin: 0; }
  .log-dialog-body { min-height: 0; overflow-y: auto; overflow-wrap: anywhere; line-height: 1.6;
                        padding: 16px; }
  .data-dialog { width: 1280px; }
  .data-dialog .log-dialog-body { padding: 12px 16px; line-height: 1.35; }
  .data-grid-scroll { overflow: auto; border: 1px solid #e3e8f2; border-radius: 8px; background: #fff; }
  .data-grid { width: max-content; min-width: 100%; font-size: 12.5px; }
  .data-grid th, .data-grid td { padding: 5px 8px; line-height: 1.35; vertical-align: top; }
  .data-grid tbody tr:hover { background: #f2f6ff; }
  .data-cell-preview { display: block; min-width: 32px; max-width: 240px; padding: 0; border: 0;
                       border-radius: 2px; background: transparent; color: inherit; font: inherit;
                       text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .data-cell-preview:hover { color: #2453b3; }
  .data-dialog .toolbar select { width: auto; }
  .data-value-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  .data-table-remark { min-width: 180px; max-width: 300px; white-space: normal; }
  .data-table-actions { display: flex; gap: 6px; }
  .qa-detail-field { margin: 12px 0 0; }
  .qa-detail-field h4 { margin: 0; font-size: 13px; }
  .ingest-overview, .ingest-detail-section { padding: 14px 16px; border: 1px solid #e3e8f2;
                                            border-radius: 10px; background: #fff; margin-bottom: 12px; }
  .ingest-overview { background: #eef3ff; border-color: #dbe5ff; }
  .ingest-overview-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .ingest-overview-head b { color: #24375d; font-size: 17px; }
  .ingest-overview .mono { margin-top: 5px; color: #4a5e7d; }
  .ingest-detail-panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 12px; }
  .ingest-detail-section h4 { margin: 0 0 8px; font-size: 13px; color: #24375d; }
  .ingest-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 125px), 1fr));
                        gap: 10px 16px; margin: 0; }
  .ingest-detail-grid dt { color: #5a6478; font-size: 12px; }
  .ingest-detail-grid dd { margin: 1px 0 0; font-size: 13px; }
  .ingest-detail-grid .wide { grid-column: 1 / -1; }
  .ingest-detail-section summary { cursor: pointer; color: #24375d; font-size: 13px; font-weight: 600; }
  .ingest-detail-section[open] summary { margin-bottom: 10px; }
  .ingest-detail-section .mini { margin-top: 10px; }
  dialog::backdrop { background: rgba(20,28,50,.45); }
  dialog h3 { margin: 0 0 14px; font-size: 16px; }
  dialog label { display: block; font-size: 12.5px; color: #5a6478; margin: 10px 0 4px; }
  dialog input, dialog select { width: 100%; box-sizing: border-box; }
  dialog textarea { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid #ccd3e0; border-radius: 7px; font-size: 13.5px; font-family: inherit; resize: vertical; }
  dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  dialog .row { display: flex; gap: 8px; align-items: center; }
  dialog .row input { flex: 1; }
  /* 前台权限勾选列表：复选框不继承 width:100%，行内左对齐 */
  dialog .perm-list { border: 1px solid #e3e8f2; border-radius: 8px;
                      padding: 2px 12px; margin: 2px 0 10px; }
  dialog .perm-item { display: flex; align-items: center; gap: 10px;
                      padding: 7px 2px; font-size: 13.5px; }
  dialog .perm-item + .perm-item { border-top: 1px dashed #eef1f8; }
  dialog .perm-item input[type="checkbox"] { width: auto; margin: 0; }
  #project-form .perm-list { max-height: 170px; overflow-y: auto; }
  #project-form .perm-item { margin: 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .empty { text-align: center; color: #8a93a6; padding: 26px 0; font-size: 13px; }
  .cost-cards { display: flex; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
  .cost-card { flex: 1; min-width: 160px; background: #f7f8fa; border-radius: 10px;
               padding: 16px 20px; border: 1px solid #e5e8ee; }
  .cost-card .label { color: #6b7688; font-size: 12px; margin-bottom: 6px; }
  .cost-card .value { font-size: 1.7em; font-weight: 700; color: #2c3e50; }
  .cost-card .sub   { color: #8a93a6; font-size: 11px; margin-top: 4px; }
  .cost-card.highlight { background: #eef4ff; border-color: #c8d8f0; }
  .cost-card.highlight .value { color: #2a5db0; }
  .cost-page { display: flex; gap: 8px; align-items: center; justify-content: center;
               margin: 14px 0; }
  .cost-page button { padding: 4px 12px; border: 1px solid #c8d0dc; border-radius: 6px;
                      background: #eaf1ff; color: #2453b3; cursor: pointer; font-size: 13px; }
  .cost-page button:not(:disabled):hover { background: #dce8ff; }
  .cost-page button:disabled { background: #edf0f5; color: #8993a4; border-color: #d9dfe8; cursor: not-allowed; }
  .cost-page button.current:not(:disabled) { background: #2a5db0; color: #fff; border-color: #2a5db0; }
  .cost-page .info { color: #6b7688; font-size: 12px; margin: 0 8px; }
  .log-detail { background: #f8f9fd; border-radius: 8px; padding: 10px 12px; margin-top: 6px;
                font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
  .clickable { cursor: pointer; }
  .clickable:hover td { background: #f6f8ff; }
  .business-form { width: 100%; max-width: 880px; }
  .business-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .business-field { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #45516b; }
  .business-field input { width: 100%; height: 42px; font-size: 14px; }
  .business-form #business-code-hint { margin-top: 9px; color: #64748b; line-height: 1.6; }
  .business-note { margin-top: 18px; }
  .business-note textarea { width: 100%; min-height: 88px; max-height: 240px; resize: vertical; font: inherit; }
  .business-field input:focus, .business-field textarea:focus { border-color: #5278df; outline: 3px solid #e8efff; }
  .business-actions { display: flex; margin-top: 18px; }
  .business-actions button { min-height: 38px; padding: 8px 20px; }
  @media (max-width: 900px) { .business-fields { grid-template-columns: 1fr; gap: 16px; } }
  .dash-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin: 22px 0 12px; }
  .dash-head h3 { margin: 0 0 5px; font-size: 17px; }
  .dash-head .toolbar { margin: 0; }
  .dash-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .dash-metrics-overview { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .dash-metrics-usage { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dash-metrics-llm { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dash-metrics-llm b { overflow-wrap: anywhere; }
  .dash-pie-grid > section { min-width: 0; }
  .dash-metric small { display: block; margin-top: 6px; color: #64748b; font-size: 12px; line-height: 1.6; }
  .dash-llm-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .dash-llm-head h3 { margin: 0; }
  .dash-llm-chart-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .dash-llm-chart-tools button[aria-pressed="true"] { background: #3d5af1; color: #fff; border-color: #3d5af1; }
  .dash-llm-stage { margin-top: 10px; line-height: 1.6; }
  .dash-llm-stage .dash-bar-row { grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) 70px; }
  .dash-metric { background: #fff; border: 1px solid #e3e8f2; border-radius: 10px; padding: 14px 16px; }
  .dash-metric span { color: #64748b; font-size: 12px; }
  .dash-metric b { display: block; font-size: 27px; margin-top: 5px; color: #263e71; }
  .dash-pie-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .dash-pie-grid > .card { min-width: 0; margin-bottom: 0; }
  .dash-pie-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .dash-pie-tools button[aria-pressed="true"] { background: #3d5af1; color: #fff; border-color: #3d5af1; }
  .dash-pie { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 16px; margin: 0; }
  .dash-pie-ring { width: 160px; height: 160px; flex: 0 0 160px; display: grid; place-items: center;
                   border-radius: 50%; background: var(--dash-pie-colors); }
  .dash-pie-center { width: 104px; height: 104px; display: flex; flex-direction: column; align-items: center;
                     justify-content: center; border-radius: 50%; background: #fff; color: #263e71; }
  .dash-pie-center b { font-size: 24px; }
  .dash-pie-legend { flex: 1 1 180px; min-width: 0; padding: 0; margin: 0; list-style: none; max-height: 200px; overflow-y: auto; }
  .dash-pie-legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; align-items: center;
                       gap: 8px; padding: 5px 0; font-size: 13px; }
  .dash-pie-legend .dash-pie-key { overflow-wrap: anywhere; }
  .dash-pie-legend .dash-pie-value { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; }
  .dash-grid > .card { min-width: 0; }
  .dash-subtitle { color: #64748b; font-size: 12px; margin: -3px 0 16px; line-height: 1.6; }
  .dash-bars { max-height: 300px; overflow-y: auto; }
  .dash-bar-row { display: grid; grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) 48px; gap: 10px; align-items: center; min-height: 36px; font-size: 13px; }
  .dash-bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-bar-track { background: #f0f4fb; border-radius: 4px; height: 10px; }
  .dash-bar-fill { background: #5277de; border-radius: 4px; height: 100%; }
  .dash-bar-value { text-align: right; color: #334155; font-variant-numeric: tabular-nums; }
  .dash-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .dash-legend button { background: #f2f6ff; color: #334155; padding: 5px 9px; border: 1px solid #d7e3f8; font-size: 12px; }
  .dash-legend button[aria-pressed="false"] { background: #fff; text-decoration: line-through; }
  .dash-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dash-trend { width: 100%; height: auto; display: block; }
  #dash-trend-area, #dash-llm-trend-area { position: relative; }
  .dash-point-hit { fill: transparent; cursor: crosshair; outline: none; }
  .dash-point:hover .dash-point-dot, .dash-point:focus-within .dash-point-dot { r: 5; stroke: #fff; stroke-width: 2; }
  .dash-tooltip { position: absolute; z-index: 10; pointer-events: none; min-width: 156px;
    padding: 11px 13px; border: 1px solid #d7e3f8; border-radius: 9px; background: #fff;
    color: #334155; font-size: 12px; box-shadow: 0 5px 20px rgba(35, 55, 98, .14); }
  .dash-tooltip > b { display: block; margin-bottom: 8px; }
  .dash-tip-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 6px; }
  .dash-channels { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 16px; }
  .dash-channel { flex: 1; min-width: 100px; border: 1px solid #e3e8f2; border-radius: 8px; padding: 12px; }
  .dash-channel b { display: block; font-size: 22px; color: #263e71; margin-top: 5px; }
  .dash-note { color: #64748b; font-size: 12px; line-height: 1.7; margin-top: 8px; }
  @media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } .dash-trend text { font-size: 14px; } }
  @media (max-width: 800px) { .dash-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash-trend text { font-size: 16px; } }
  @media (max-width: 700px) { .dash-pie-grid { grid-template-columns: 1fr; } }
  .hidden { display: none; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><img src="/static/gw_logo.png" alt="长城互联网"
        style="display:block;height:34px;width:auto;max-width:100%;object-fit:contain;
               margin:0 0 8px;background:#fff;border-radius:4px;padding:1px 3px;"> 长城互联网<span>RAG管理后台</span></div>
  <nav id="tabs"></nav>
  <span class="spacer"></span>
  <div class="who">👤 <b>{{ admin['username'] }}</b><br>
    <a onclick="logout()">↩ 退出登录</a></div>
</aside>
<main>
  <div id="view"></div>
</main>
<div class="toasts" id="toasts"></div>

<dialog id="dlg">
  <h3 id="dlg-title"></h3>
  <div id="dlg-body"></div>
  <div class="actions">
    <button class="secondary" onclick="closeDlg()">取消</button>
    <button id="dlg-ok" type="button">确认</button>
  </div>
</dialog>
<dialog id="ingest-detail" class="log-dialog" aria-labelledby="ingest-detail-title">
  <header class="log-dialog-header">
    <h3 id="ingest-detail-title">入库详情</h3>
    <form method="dialog"><button type="submit" class="mini secondary" autofocus>关闭</button></form>
  </header>
  <div id="ingest-detail-body" class="log-dialog-body"></div>
</dialog>
<dialog id="qa-log-detail" class="log-dialog" aria-labelledby="qa-log-detail-title">
  <header class="log-dialog-header">
    <h3 id="qa-log-detail-title">检索详情</h3>
    <form method="dialog"><button type="submit" class="mini secondary" autofocus>关闭</button></form>
  </header>
  <div id="qa-log-detail-body" class="log-dialog-body"></div>
</dialog>
<dialog id="data-table-detail" class="log-dialog data-dialog" aria-labelledby="data-table-detail-title">
  <header class="log-dialog-header">
    <h3 id="data-table-detail-title"></h3>
    <form method="dialog"><button type="submit" class="mini secondary" autofocus>关闭</button></form>
  </header>
  <div id="data-table-detail-body" class="log-dialog-body"></div>
</dialog>
<dialog id="data-schema-detail" class="log-dialog" aria-labelledby="data-schema-detail-title">
  <header class="log-dialog-header">
    <h3 id="data-schema-detail-title"></h3>
    <form method="dialog"><button type="submit" class="mini secondary" autofocus>关闭</button></form>
  </header>
  <div id="data-schema-detail-body" class="log-dialog-body"></div>
</dialog>
<dialog id="data-value-detail" class="log-dialog" aria-labelledby="data-value-detail-title">
  <header class="log-dialog-header">
    <h3 id="data-value-detail-title">完整值</h3>
    <form method="dialog"><button type="submit" class="mini secondary" autofocus>关闭</button></form>
  </header>
  <div class="log-dialog-body">
    <div class="toolbar"><span id="data-value-info" class="muted"></span>
      <button id="data-value-copy" type="button" class="mini secondary" onclick="copyDataValue()">复制完整值</button></div>
    <pre id="data-value-text" class="mono data-value-text"></pre>
  </div>
</dialog>
<dialog id="admin-operation-detail" class="log-dialog" aria-labelledby="admin-operation-detail-title">
  <header class="log-dialog-header">
    <h3 id="admin-operation-detail-title">管理员操作详情</h3>
    <form method="dialog"><button type="submit" class="mini secondary" autofocus>关闭</button></form>
  </header>
  <div id="admin-operation-detail-body" class="log-dialog-body"></div>
</dialog>

<script>
const $ = sel => document.querySelector(sel);
const me = "{{ admin['username'] }}";  // 当前登录管理员
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ok ? 3200 : 5200);
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json';
                            opt.body = JSON.stringify(body); }
  const resp = await fetch(path, opt);
  if (resp.status === 401) { location.href = '/admin/login?err=' +
    encodeURIComponent('会话已过期，请重新登录'); throw new Error('unauthorized'); }
  let data = {};
  try { data = await resp.json(); } catch (e) {}
  if (!resp.ok || data.ok === false) {
    throw new Error(data.detail || ('请求失败（' + resp.status + '）'));
  }
  return data;
}

/* ---------- 对话框 ---------- */
let dlgConfirm = null;
function openDlg(title, bodyHtml, onOk, okText = '确认') {
  $('#dlg-title').textContent = title;
  $('#dlg-body').innerHTML = bodyHtml;
  const ok = $('#dlg-ok');
  ok.textContent = okText;
  ok.onclick = async () => { try { await onOk(); closeDlg(); }
                             catch (e) { toast(e.message, false); } };
  const dlg = $('#dlg');
  if (!dlg.open) dlg.showModal();  // 已打开时仅替换内容（员工对话框就地刷新用）
}
function closeDlg() { $('#dlg').close(); dlgConfirm = null; }

function confirmDo(title, msg, fn, okText = '确认', danger = false) {
  openDlg(title, `<div class="log-detail">${esc(msg)}</div>`, fn,
          okText);
  if (danger) $('#dlg-ok').className = 'danger'; else $('#dlg-ok').className = '';
}

/* ---------- 标签页框架 ---------- */
const TABS = [
  { id: 'dash',    name: '工作台',     render: renderDash },
  { id: 'departments-employees', name: '部门及员工管理', children: [
    { id: 'deps', name: '部门管理', render: renderDeps },
    { id: 'emps', name: '员工管理', render: renderEmps },
  ] },
  { id: 'business-projects', name: '业务及项目管理', children: [
    { id: 'business', name: '业务方向', render: renderBusinessDirections },
    { id: 'projects', name: '项目管理', render: renderProjects },
  ] },
  { id: 'ingestlog', name: '入库文件', render: renderIngestLog },
  { id: 'admins',  name: '管理员',     render: renderAdmins },
  { id: 'tokens',  name: 'MCP访问令牌', render: renderTokens },
  { id: 'logs', name: '日志', children: [
    { id: 'adminauth', name: '管理员登录日志', render: renderAdminLoginLog },
    { id: 'adminops', name: '管理员操作日志', render: renderAdminOperations },
    { id: 'authlog', name: '员工登录日志', render: renderAuthLog },
    { id: 'qalog', name: '员工检索日志', render: renderQaLog },
  ] },
  { id: 'llmcost', name: 'LLM 费用',   render: renderLlmCost },
  { id: 'data',    name: '数据管理',   render: renderDataManagement },
  { id: 'services', name: '服务状态',  render: renderServices },
];
let current = 'dash';
let svcBusy = false;  // 服务控制动作进行中：防重复点击，按钮按当前状态禁用

const openMenus = new Set();
function renderNavigation() {
  const leaf = tab => `<button type="button" data-id="${tab.id}" class="${current === tab.id ? 'active' : ''}"
    ${current === tab.id ? 'aria-current="page"' : ''} onclick="switchTab('${tab.id}')">${esc(tab.name)}</button>`;
  $('#tabs').innerHTML = TABS.map(tab => {
    if (!tab.children) return leaf(tab);
    const active = tab.children.some(child => child.id === current);
    const expanded = openMenus.has(tab.id);
    return `<button type="button" data-id="${tab.id}" class="nav-group ${active ? 'active' : ''}"
      aria-expanded="${expanded}" aria-controls="${tab.id}-submenu" onclick="toggleMenu('${tab.id}')">
        ${esc(tab.name)}<span aria-hidden="true">${expanded ? '▾' : '▸'}</span></button>
      <div id="${tab.id}-submenu" class="nav-submenu" ${expanded ? '' : 'hidden'}>
        ${tab.children.map(leaf).join('')}
      </div>`;
  }).join('');
}
function toggleMenu(id) {
  if (openMenus.has(id)) openMenus.delete(id);
  else openMenus.add(id);
  renderNavigation();
  $(`#tabs button[data-id="${id}"]`).focus();
}
function switchTab(id) {
  const tab = TABS.flatMap(item => item.children || [item]).find(item => item.id === id);
  if (!tab) return;
  current = id;
  const parent = TABS.find(item => item.children?.some(child => child.id === id));
  if (parent) openMenus.add(parent.id);
  renderNavigation();
  $('#view').innerHTML = '<div class="empty">加载中…</div>';
  return tab.render().catch(e => {
    if (current === id) $('#view').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  });
}

async function logout() {
  // 退出前确认：防误触（登录日志会完整记录本次登出）
  openDlg('确认退出登录', '<div class="log-detail">退出后需要重新输入账户密码才能再次进入管理后台。确认退出吗？</div>',
    async () => { await fetch('/admin/logout'); location.href = '/admin/login'; },
    '确认退出');
}

/* ---------- 工作台 ---------- */
let dashboardDays = 30;
let dashboardRequest = 0;
let dashboardData = null;
let dashboardIngestPeriod = null;
let dashboardInventoryData = null;
let dashboardInventoryMode = 'direction';
let dashboardVisible = {web: true, mcp: true, other: true};
let dashboardLlmMetric = 'calls';
let dashboardLlmStageMetric = 'calls';
const dashboardColors = {web: '#4263d7', mcp: '#0c9488', other: '#9b6bce'};
const dashNum = n => Math.max(0, Number(n) || 0).toLocaleString();
function dashboardBars(rows, key, emptyText) {
  if (!rows.length) return `<div class="empty">${esc(emptyText)}</div>`;
  const max = Math.max(1, ...rows.map(row => Number(row[key]) || 0));
  return `<div class="dash-bars">${rows.map(row => `<div class="dash-bar-row">
    <span class="dash-bar-name" title="${esc(row.name)}">${esc(row.name)}</span>
    <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${Math.max(0, Number(row[key]) || 0) / max * 100}%"></div></div>
    <span class="dash-bar-value">${dashNum(row[key])}</span></div>`).join('')}</div>`;
}
function dashboardToggleChannel(key) {
  dashboardVisible[key] = !dashboardVisible[key];
  $('#dash-trend-area').innerHTML = dashboardTrend(dashboardData);
}
function dashboardHideTooltip() {
  const tip = document.querySelector('#dash-trend-tooltip');
  if (tip) tip.hidden = true;
  const guide = document.querySelector('#dash-trend-guide');
  if (guide) guide.style.display = 'none';
}
function dashboardMoveOnChart(event) {
  const rect = event.currentTarget.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width * 760;
  const y = (event.clientY - rect.top) / rect.height * 250;
  if (x < 34 || x > 744 || y < 8 || y > 218 || !dashboardData?.daily.length) {
    dashboardHideTooltip();
    return;
  }
  const index = Math.max(0, Math.min(dashboardData.daily.length - 1,
    Math.round((x - 44) / 690 * (dashboardData.daily.length - 1))));
  dashboardShowTooltip(event, index);
}
function dashboardShowTooltip(event, index) {
  const area = document.querySelector('#dash-trend-area');
  const tip = document.querySelector('#dash-trend-tooltip');
  const day = dashboardData?.daily[index];
  if (!area || !tip || !day) return;
  const channels = dashboardData.channels.filter(c => dashboardVisible[c.key] && (c.key !== 'other' || c.requests > 0));
  tip.innerHTML = `<b>${esc(day.date)}</b>${channels.map(c => `<div class="dash-tip-row">
    <span><span class="dash-dot" style="background:${dashboardColors[c.key]}"></span>${esc(c.name)}</span>
    <strong>${dashNum(day[c.key])} 次</strong></div>`).join('')}`;
  tip.hidden = false;
  const bounds = area.getBoundingClientRect();
  const point = event.currentTarget.tagName.toLowerCase() === 'svg'
    ? {right: event.clientX, top: event.clientY, bottom: event.clientY}
    : event.currentTarget.getBoundingClientRect();
  const left = point.right - bounds.left + 10;
  const top = point.top - bounds.top - tip.offsetHeight - 10;
  tip.style.left = Math.max(0, Math.min(left, area.clientWidth - tip.offsetWidth)) + 'px';
  tip.style.top = Math.max(0, top < 0 ? point.bottom - bounds.top + 10 : top) + 'px';
  const guide = document.querySelector('#dash-trend-guide');
  if (guide) {
    const x = 44 + index / Math.max(1, dashboardData.daily.length - 1) * 690;
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.style.display = 'block';
  }
}
function dashboardTrend(stats) {
  const channels = stats.channels.filter(c => c.key !== 'other' || c.requests > 0);
  const legend = `<div class="dash-legend">${channels.map(c => `<button type="button" aria-pressed="${dashboardVisible[c.key]}"
    onclick="dashboardToggleChannel('${c.key}')"><span class="dash-dot" style="background:${dashboardColors[c.key]}"></span>${esc(c.name)} · ${dashNum(c.requests)} 次</button>`).join('')}</div>`;
  const shown = channels.filter(c => dashboardVisible[c.key]);
  if (!stats.requests || !shown.length) return legend + `<div class="empty">${stats.requests ? '请选择要显示的入口' : '所选时间内暂无检索记录'}</div>`;
  const daily = stats.daily, left = 44, top = 18, width = 690, height = 190;
  const maximum = Math.max(4, Math.ceil(Math.max(...daily.flatMap(d => shown.map(c => d[c.key] || 0))) / 4) * 4);
  const x = i => left + i / Math.max(1, daily.length - 1) * width;
  const y = value => top + height - value / maximum * height;
  let parts = [];
  for (let i = 0; i <= 4; i++) {
    const value = maximum / 4 * i;
    parts.push(`<line x1="${left}" y1="${y(value)}" x2="${left + width}" y2="${y(value)}" stroke="#e5eaf3"/>
      <text x="${left - 9}" y="${y(value) + 4}" text-anchor="end" fill="#64748b" font-size="11">${value}</text>`);
  }
  const labels = new Set([0, daily.length - 1, ...daily.map((_, i) => i).filter(i => i % Math.max(1, Math.ceil(daily.length / 6)) === 0)]);
  for (const i of labels) parts.push(`<text x="${x(i)}" y="235" text-anchor="middle" fill="#64748b" font-size="11">${esc(daily[i].date.slice(5))}</text>`);
  for (const c of shown) {
    parts.push(`<polyline points="${daily.map((d, i) => `${x(i)},${y(d[c.key] || 0)}`).join(' ')}" fill="none" stroke="${dashboardColors[c.key]}" stroke-width="2.5" stroke-linejoin="round"/>`);
    for (let i = 0; i < daily.length; i++) parts.push(`<g class="dash-point">
      <circle class="dash-point-dot" cx="${x(i)}" cy="${y(daily[i][c.key] || 0)}" r="3.5" fill="${dashboardColors[c.key]}" pointer-events="none"/>
      <circle class="dash-point-hit" cx="${x(i)}" cy="${y(daily[i][c.key] || 0)}" r="10" tabindex="0"
        aria-label="${esc(daily[i].date)} ${esc(c.name)}：${dashNum(daily[i][c.key])} 次" aria-describedby="dash-trend-tooltip"
        onpointerenter="dashboardShowTooltip(event, ${i})" onpointermove="dashboardShowTooltip(event, ${i})"
        onpointerleave="dashboardHideTooltip()" onfocus="dashboardShowTooltip(event, ${i})" onblur="dashboardHideTooltip()"
        onkeydown="if(event.key === 'Escape') dashboardHideTooltip()"/>
    </g>`);
  }
  return legend + `<svg class="dash-trend" viewBox="0 0 760 250" role="img" aria-label="员工每日检索次数，按 Web 和 MCP 区分"
    onpointermove="dashboardMoveOnChart(event)" onpointerleave="dashboardHideTooltip()">
    <line id="dash-trend-guide" y1="18" y2="208" stroke="#b8c5df" stroke-dasharray="4 4" pointer-events="none" style="display:none"/>
    ${parts.join('')}</svg><div id="dash-trend-tooltip" class="dash-tooltip" role="tooltip" hidden></div>`;
}
const dashboardLlmMetrics = {
  calls: {name: '调用次数', unit: '次', color: '#4263d7'},
  input: {name: '输入 tokens', unit: 'tokens', color: '#0c9488'},
  output: {name: '输出 tokens', unit: 'tokens', color: '#9b6bce'},
  cost: {name: '估算费用', unit: '元', color: '#b85f16'},
};
const dashCost = value => Math.max(0, Number(value) || 0).toLocaleString(undefined,
  {minimumFractionDigits: 4, maximumFractionDigits: 4});
function dashboardLlmSetMetric(key) {
  if (!dashboardLlmMetrics[key] || !dashboardData?.llm) return;
  dashboardLlmMetric = key;
  $('#dash-llm-trend-area').innerHTML = dashboardLlmTrend(dashboardData.llm);
}
function dashboardLlmHideTooltip() {
  const tip = $('#dash-llm-tooltip');
  if (tip) tip.hidden = true;
  const guide = $('#dash-llm-guide');
  if (guide) guide.style.display = 'none';
}
function dashboardLlmShowTooltip(event, index) {
  const area = $('#dash-llm-trend-area'), tip = $('#dash-llm-tooltip');
  const daily = dashboardData?.llm?.daily_llm || [], day = daily[index];
  if (!area || !tip || !day) return;
  tip.innerHTML = `<b>${esc(day.date)}</b>${Object.entries(dashboardLlmMetrics).map(([key, metric]) =>
    `<div class="dash-tip-row"><span><span class="dash-dot" style="background:${metric.color}"></span>${esc(metric.name)}</span>
      <strong>${key === 'cost' ? dashCost(day[key]) : dashNum(day[key])} ${metric.unit}</strong></div>`).join('')}
    <div class="dash-tip-row"><span>其中缓存命中</span><strong>${dashNum(day.input_cached)} tokens</strong></div>`;
  tip.hidden = false;
  const bounds = area.getBoundingClientRect();
  const point = event.currentTarget.tagName.toLowerCase() === 'svg'
    ? {right: event.clientX, top: event.clientY, bottom: event.clientY}
    : event.currentTarget.getBoundingClientRect();
  tip.style.left = Math.max(0, Math.min(point.right - bounds.left + 10,
    area.clientWidth - tip.offsetWidth)) + 'px';
  const top = point.top - bounds.top - tip.offsetHeight - 10;
  tip.style.top = Math.max(0, top < 0 ? point.bottom - bounds.top + 10 : top) + 'px';
  const guide = $('#dash-llm-guide');
  if (guide) {
    const x = 64 + index / Math.max(1, daily.length - 1) * 650;
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.style.display = 'block';
  }
}
function dashboardLlmMoveOnChart(event) {
  const rect = event.currentTarget.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width * 760;
  const y = (event.clientY - rect.top) / rect.height * 250;
  const daily = dashboardData?.llm?.daily_llm || [];
  if (x < 54 || x > 724 || y < 8 || y > 218 || !daily.length) {
    dashboardLlmHideTooltip(); return;
  }
  const index = Math.max(0, Math.min(daily.length - 1,
    Math.round((x - 64) / 650 * (daily.length - 1))));
  dashboardLlmShowTooltip(event, index);
}
function dashboardLlmTrend(llm) {
  const key = dashboardLlmMetric, metric = dashboardLlmMetrics[key];
  const controls = `<div class="dash-llm-chart-tools">${Object.entries(dashboardLlmMetrics).map(([k, m]) =>
    `<button type="button" aria-pressed="${key === k}" onclick="dashboardLlmSetMetric('${k}')">${m.name}</button>`).join('')}</div>`;
  const daily = llm.daily_llm || [];
  if (!llm.verified_requests || !daily.length) return controls + '<div class="empty">所选范围内暂无本次用量记录</div>';
  const left = 64, top = 18, width = 650, height = 190;
  const peak = Math.max(0, ...daily.map(day => Number(day[key]) || 0));
  const maximum = key === 'cost' ? Math.max(0.0001, peak * 1.1) : Math.max(4, Math.ceil(peak / 4) * 4);
  const x = i => left + i / Math.max(1, daily.length - 1) * width;
  const y = value => top + height - value / maximum * height;
  const tick = value => key === 'cost' ? dashCost(value) : dashNum(value);
  const parts = [];
  for (let i = 0; i <= 4; i++) {
    const value = maximum / 4 * i;
    parts.push(`<line x1="${left}" y1="${y(value)}" x2="${left + width}" y2="${y(value)}" stroke="#e5eaf3"/>
      <text x="${left - 9}" y="${y(value) + 4}" text-anchor="end" fill="#64748b" font-size="11">${tick(value)}</text>`);
  }
  const labels = new Set([0, daily.length - 1, ...daily.map((_, i) => i)
    .filter(i => i % Math.max(1, Math.ceil(daily.length / 6)) === 0)]);
  for (const i of labels) parts.push(`<text x="${x(i)}" y="235" text-anchor="middle" fill="#64748b" font-size="11">${esc(daily[i].date.slice(5))}</text>`);
  parts.push(`<polyline points="${daily.map((day, i) => `${x(i)},${y(day[key] || 0)}`).join(' ')}" fill="none"
    stroke="${metric.color}" stroke-width="2.5" stroke-linejoin="round"/>`);
  for (let i = 0; i < daily.length; i++) parts.push(`<g class="dash-point">
    <circle class="dash-point-dot" cx="${x(i)}" cy="${y(daily[i][key] || 0)}" r="3.5" fill="${metric.color}" pointer-events="none"/>
    <circle class="dash-point-hit" cx="${x(i)}" cy="${y(daily[i][key] || 0)}" r="10" tabindex="0"
      aria-label="${esc(daily[i].date)} ${metric.name}：${tick(daily[i][key])} ${metric.unit}" aria-describedby="dash-llm-tooltip"
      onpointerenter="dashboardLlmShowTooltip(event, ${i})" onpointermove="dashboardLlmShowTooltip(event, ${i})"
      onpointerleave="dashboardLlmHideTooltip()" onfocus="dashboardLlmShowTooltip(event, ${i})" onblur="dashboardLlmHideTooltip()"
      onkeydown="if(event.key === 'Escape') dashboardLlmHideTooltip()"/>
  </g>`);
  return controls + `<div class="dash-subtitle">每日${metric.name}（${metric.unit}）；悬停可查看当日全部指标</div>
    <svg class="dash-trend" viewBox="0 0 760 250" role="img" aria-label="每日${metric.name}趋势"
      onpointermove="dashboardLlmMoveOnChart(event)" onpointerleave="dashboardLlmHideTooltip()">
      <line id="dash-llm-guide" y1="18" y2="208" stroke="#b8c5df" stroke-dasharray="4 4" pointer-events="none" style="display:none"/>
      ${parts.join('')}</svg><div id="dash-llm-tooltip" class="dash-tooltip" role="tooltip" hidden></div>`;
}
function dashboardLlmSetStageMetric(key) {
  if (!['calls', 'input', 'output'].includes(key) || !dashboardData?.llm) return;
  dashboardLlmStageMetric = key;
  $('#dash-llm-stages').innerHTML = dashboardLlmStages(dashboardData.llm);
}
function dashboardLlmStages(llm) {
  const key = dashboardLlmStageMetric;
  const controls = `<div class="dash-llm-chart-tools">${['calls', 'input', 'output'].map(k =>
    `<button type="button" aria-pressed="${key === k}" onclick="dashboardLlmSetStageMetric('${k}')">${dashboardLlmMetrics[k].name}</button>`).join('')}</div>`;
  return controls + dashboardBars((llm.stages || []).filter(row => Number(row[key]) > 0), key, '暂无该指标的环节明细');
}
function dashboardOpenLlmCosts() {
  llmCostFilter = { days: dashboardDays, page: 1, username: '', entry: null };
  return switchTab('llmcost');
}
function dashboardChangeDays(value) {
  dashboardDays = Number(value);
  renderDash().catch(e => toast(e.message, false));
}
const dashboardInventoryCount = value => value == null ? '—' : dashNum(value);
function dashboardPie(items, label, unit, emptyText) {
  const total = items.reduce((sum, item) => sum + item.count, 0);
  if (!total) return `<div class="empty">${esc(emptyText)}</div>`;
  let end = 0;
  const stops = items.filter(item => item.count > 0).map((item, index, active) => {
    const start = end;
    end = index === active.length - 1 ? 100 : end + item.count / total * 100;
    return `${item.color} ${start}% ${end}%`;
  });
  const legend = items.map(item => `<li>
    <span aria-hidden="true" class="dash-dot" style="background:${item.color}"></span>
    <span class="dash-pie-key">${esc(item.name)}</span>
    <b class="dash-pie-value">${dashNum(item.count)} ${esc(unit)}</b>
    <span class="muted dash-pie-value">${(item.count / total * 100).toLocaleString(undefined, {maximumFractionDigits: 1})}%</span>
  </li>`).join('');
  return `<figure class="dash-pie" aria-label="${esc(label)}">
    <div class="dash-pie-ring" style="--dash-pie-colors:conic-gradient(${stops.join(',')})" aria-hidden="true">
      <div class="dash-pie-center"><b>${dashNum(total)}</b><span class="muted">${esc(unit)}</span></div>
    </div><ul class="dash-pie-legend">${legend}</ul></figure>`;
}
function dashboardInventoryPie(inventory, mode) {
  const palette = ['#4263d7', '#0c9488', '#9b6bce', '#b85f16', '#308356', '#b94160', '#497b9f'];
  const rows = mode === 'project' ? inventory.groups.flatMap(group => group.projects) : inventory.groups;
  const items = rows.filter(row => row.documents > 0).sort((a, b) => b.documents - a.documents);
  const segments = items.slice(0, palette.length).map((row, index) => ({
    name: row.name, count: row.documents, color: palette[index],
  }));
  if (items.length > palette.length) segments.push({
    name: mode === 'project' ? '其他项目' : '其他业务方向', color: '#6e80a7',
    count: items.slice(palette.length).reduce((sum, row) => sum + row.documents, 0),
  });
  if (inventory.unlinked_documents > 0) segments.push({name: '未关联项目', count: inventory.unlinked_documents, color: '#a5afc0'});
  return dashboardPie(segments, mode === 'project' ? '按项目分布' : '按业务方向分布', '份', '暂无有效索引文档');
}
function dashboardSetInventoryMode(mode) {
  const chart = $('#dash-inventory-pie');
  if (!dashboardInventoryData?.available || !chart || !['direction', 'project'].includes(mode)) return;
  dashboardInventoryMode = mode;
  chart.innerHTML = dashboardInventoryPie(dashboardInventoryData, mode);
  document.querySelectorAll('[data-dashboard-inventory-mode]').forEach(button =>
    button.setAttribute('aria-pressed', String(button.dataset.dashboardInventoryMode === mode)));
}
function dashboardOverviewCounts(overview, inventory) {
  return [
    ['RAG可检索文档', inventory?.documents],
    ['业务方向', inventory?.direction_count ?? overview.business_directions],
    ['项目', inventory?.project_count],
    ['部门', overview.departments],
    ['员工', overview.users],
  ].map(([label, count]) => `<div class="dash-metric"><span>${label}</span><b>${dashboardInventoryCount(count)}</b></div>`).join('');

async function openDataSchema(table) {

      <td>${c.not_null ? '是' : '否'}</td><td>${esc(c.default ?? '—')}</td>
      <td>${c.primary_key ? `🔑 ${c.primary_key_order}` : '—'}</td><td>${c.hidden === 2 || c.hidden === 3 ? '生成列' : c.hidden ? '隐藏列' : '普通列'}</td></tr>`).join('');
    const indexRows = (d.indexes || []).map(i => `<tr><td>${esc(i.name)}</td><td>${i.unique ? '唯一' : '普通'}</td>

      <h4>索引</h4>${indexRows ? `<div style="overflow-x:auto"><table><tr><th>索引名</th><th>类型</th><th>索引键</th></tr>${indexRows}</table></div>` : '<p class="muted">无索引</p>'}

function openDataTable(table) {
  dataTableState = { table, page: 1, pageSize: 50, totalPages: 1, total: 0 };
  $('#data-table-detail-title').textContent = `数据列表 — ${table}`;
  $('#data-table-detail-body').innerHTML = '<div class="empty">加载中…</div>';

  if (!dialog.open) dialog.showModal();
  loadDataTableRow().catch(e => toast(e.message, false));
}
function dataCell(value, row, column) {
  const text = value === null ? 'NULL' : value?.type === 'blob' ? `<BLOB ${value.bytes} 字节>` : value === '' ? '（空字符串）' : String(value);
  const preview = text.slice(0, 120).replace(/\s+/g, ' ') + (text.length > 120 ? '…' : '');
  return `<td><button type="button" class="data-cell-preview${value === null || value === '' ? ' muted' : ''}"
    aria-label="查看第 ${row + 1} 行 ${esc(dataPageColumns[column])} 的完整值" onclick="openDataValue(${row}, ${column})">${esc(preview)}</button></td>`;
}
function openDataValue(row, column) {
  if (!dataPageRows[row] || column < 0 || column >= dataPageColumns.length) return;
  const value = dataPageRows[row][column];
  $('#data-value-detail-title').textContent = `完整值 — ${dataTableState.table} · ${dataPageColumns[column]}`;
  $('#data-value-info').textContent = value === null ? 'NULL（无值）' : value?.type === 'blob' ? `BLOB · ${value.bytes} 字节 · 十六进制` : value === '' ? '空字符串 · 0 字符' : `${String(value).length} 字符`;
  $('#data-value-text').textContent = value === null ? 'NULL' : value?.type === 'blob' ? value.hex : String(value);
  $('#data-value-copy').disabled = value === null;
  const dialog = $('#data-value-detail');
  if (!dialog.open) dialog.showModal();
  $('#data-value-text').parentElement.scrollTop = 0;
}
function copyDataValue() {
  copyText($('#data-value-text').textContent, undefined, $('#data-value-detail'));
}
async function loadDataTableRow() {
  const state = dataTableState, { table, page, pageSize } = state;
  const request = ++dataTableRequest;
  clearDataPage();
  $('#data-table-detail-body').innerHTML = '<div class="empty">加载中…</div>';
  let d;
  try {
    d = await api('GET', `/api/data/tables/${encodeURIComponent(table)}/rows?page=${page}&page_size=${pageSize}`);
  } catch (e) {
    if (state === dataTableState && request === dataTableRequest && $('#data-table-detail').open)
      $('#data-table-detail-body').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }
  if (state !== dataTableState || request !== dataTableRequest || !$('#data-table-detail').open) return;
  state.total = d.total; state.totalPages = d.total_pages; state.page = d.page;
  dataPageRows = d.rows; dataPageColumns = d.data_columns || d.columns.map(c => c.name);
  const head = dataPageColumns.map(name => `<th>${esc(name)}</th>`).join('');
  const body = d.rows.map((row, r) => `<tr>${row.map((value, c) => dataCell(value, r, c)).join('')}</tr>`).join('');
  $('#data-table-detail-body').innerHTML = `<div class="muted" style="margin-bottom:10px">共 ${dashNum(d.total)} 行 · 第 ${d.page} / ${d.total_pages} 页（每页 ${d.page_size} 行）。单页读取使用同一数据库快照。</div>
    <p class="muted">单行预览避免长内容撑高行距；点击单元格查看及复制完整值。</p>
    <h4>数据（本页 ${d.rows.length} 行）</h4><div class="data-grid-scroll"><table class="data-grid">
      <thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${Math.max(1, dataPageColumns.length)}" class="empty">表中没有数据</td></tr>`}</tbody></table></div>
    <div class="toolbar" style="margin-top:12px">
      <button class="mini secondary" ${d.page <= 1 ? 'disabled' : ''} onclick="dataTablePage(-1)">上一页</button>
      <span class="muted">第 ${d.page} / ${d.total_pages} 页</span>
      <button class="mini secondary" ${d.page >= d.total_pages ? 'disabled' : ''} onclick="dataTablePage(1)">下一页</button>

}
function dataTablePage(delta) {
  const next = Math.min(Math.max(1, dataTableState.page + delta), dataTableState.totalPages);
  if (next === dataTableState.page) return;
  dataTableState.page = next;
  loadDataTableRow().catch(e => toast(e.message, false));
}
function dataTablePageSize(size) {
  dataTableState.pageSize = size; dataTableState.page = 1;
  loadDataTableRow().catch(e => toast(e.message, false));
}
function confirmDataExport() {
  if (dataExportBusy) return;
  confirmDo('确认导出整个数据库', '快照包含员工及管理员信息、密码哈希、令牌哈希和全部日志，仅供受信任管理员备份。文件不会上传到第三方，但下载后须妥善保管。确认导出？',
    downloadDataExport, '确认导出');
}
async function downloadDataExport() {
  if (dataExportBusy) return;
  dataExportBusy = true;
  if ($('#data-export-button')) $('#data-export-button').disabled = true;
  let link, url;
  try {
    const response = await fetch('/api/data/export');
    if (!response.ok) {
      if (response.status === 401) throw new Error('会话已过期，请重新登录');
      throw new Error('数据库导出失败，请查看后台日志');
    }
    const blob = await response.blob();
    const header = response.headers.get('content-disposition') || '';
    const match = header.match(/filename="([^"]+)"/);
    url = URL.createObjectURL(blob); link = document.createElement('a');
    link.href = url; link.download = match ? match[1] : 'sky_rag_backup.db';
    document.body.appendChild(link); link.click();
    toast('数据库快照已下载，请妥善保管');
  } finally {
    if (link) link.remove();
    if (url) setTimeout(() => URL.revokeObjectURL(url), 1000);
    dataExportBusy = false;
    if ($('#data-export-button')) $('#data-export-button').disabled = false;
  }
}

function serviceStatusTable(services, busy) {
  const rows = services.map(s => {

    return `

    <td>${s.ok ? '<span class="tag on">🟢 运行中</span>' : running
      ? '<span class="tag neutral">🟠 已运行，未就绪</span>' : '<span class="tag off">🔴 未运行</span>'}
      ${s.detail ? `<div class="muted">${esc(s.detail)}</div>` : ''}</td>
    <td>${btn('开启', 'start', !running && !busy)} ${btn('停止', 'stop', running && !busy)}</td></tr>`;
  }).join('');
  return `<table><tr><th>服务</th><th>状态</th><th>操作</th></tr>${rows}</table>`;
}

/* 轮询服务状态直到满足条件（重启后全部恢复 / 停止后全部停掉）。
   重启窗口期内后台自身会短暂不可达，请求失败属预期，继续轮询。 */
async function pollServices(matcher, maxMs = 45000) {
  const start = Date.now();
  while (Date.now() - start < maxMs) {
    await new Promise(r => setTimeout(r, 4000));
    let services = null;
    try {
      const d = await fetchServices();
      services = d.services;
      updateServiceRows(services);
    } catch (e) { /* 服务重启窗口期：不可达属预期 */ }
    if (services && matcher(services)) return true;
  }
  return false;
}

/* 单服务开启/停止：收到指令后等待实际状态变化，不提前宣称操作成功。 */
function svcAct(key, action) {
  if (svcBusy) return;
  if (action === 'stop') {
    const message = key === 'admin'
      ? '停止管理后台后，本页面将无法访问。需要在电脑上重新启动后台或运行 start.bat，才能再次进入。确认停止吗？'
      : '停止此服务会影响正在进行的问答或入库任务。确认停止吗？';
    confirmDo('确认停止服务', message, () => runServiceAction(key, action), '确认停止', true);
    return;
  }
  return runServiceAction(key, action);
}

async function runServiceAction(key, action) {
  if (svcBusy) return;
  svcBusy = true;
  document.querySelectorAll('#svc-status-box button').forEach(b => { b.disabled = true; });
  try {
    await api('POST', `/api/services/${key}/${action}`);
    closeDlg();
    if (key === 'admin' && action === 'stop') {
      const row = $('#svc-status-box');
      if (row) row.innerHTML = '<div class="empty">后台停止指令已发出，本页面即将无法访问。请在电脑上重新启动后台后再刷新。</div>';
      toast('后台停止指令已发出');
      return;
    }
    toast(action === 'start' ? '开启指令已发出，正在等待服务就绪…' : '停止指令已发出，正在等待状态更新…');
    const reached = await pollServices(list => {
      const service = list.find(s => s.key === key);
      return service && (action === 'start' ? service.ok : !(service.running ?? service.ok));
    });
    if (current === 'services') await renderServices();
    let statusDetail = '';
    if (!reached) {
      try {
        const latest = await fetchServices();
        statusDetail = latest.services.find(service => service.key === key)?.detail || '';
      } catch (e) {}
    }
    toast(reached ? (action === 'start' ? '服务已开启' : '服务已停止')
      : `${statusDetail || '服务状态尚未达到预期'}；请查看 storage/service_script_control.log 及该服务日志`, reached);
  } catch (e) {
    toast(e.message || '操作失败，请检查后台连接', false);
  } finally {
    svcBusy = false;
    if (current === 'services' && !(key === 'admin' && action === 'stop')) {
      try { await renderServices(); } catch (e) {}
    }
  }
}

function businessNameChanged(form) {
  clearTimeout(businessCodeTimer);
  const name = form.elements.name.value.trim();
  if (form.dataset.manualCode === '1') return;
  // 清空旧预览：名称改变后立即提交时，由服务端生成新名称对应的编号。
  form.elements.code.value = '';
  if (!name) return;
  businessCodeTimer = setTimeout(async () => {
    try {
      const d = await api('GET', (form.dataset.codeEndpoint || '/api/business-directions/suggest-code') + '?name=' + encodeURIComponent(name));
      if (form.isConnected && form.elements.name.value.trim() === name && form.dataset.manualCode !== '1') {
        form.elements.code.value = d.code;
        const hint = form.querySelector('.business-code-hint');
        if (hint) hint.textContent = '已自动生成拼音，可手动调整；名称和编号均不可重复。';
      }
    } catch (e) {
      if (form.isConnected && form.elements.name.value.trim() === name && form.dataset.manualCode !== '1') {
        const hint = form.querySelector('.business-code-hint');
        if (hint) hint.textContent = e.message + '；也可以手动填写字母编号。';
      }
    }
  }, 250);
}
async function prepareAutomaticCode(form) {
  if (!form.elements.name.reportValidity()) throw new Error('请检查名称');
  clearTimeout(businessCodeTimer);
  if (!form.elements.code.value.trim() && form.dataset.manualCode !== '1') {
    // 名称输入后立即保存，也要等待新名称对应的拼音，不能提交旧编号。
    const name = form.elements.name.value.trim();
    const d = await api('GET', (form.dataset.codeEndpoint || '/api/business-directions/suggest-code') + '?name=' + encodeURIComponent(name));
    if (!form.isConnected) throw new Error('编辑窗口已关闭，请重新确认后保存');
    if (form.elements.name.value.trim() !== name) throw new Error('名称已变化，请确认后重新保存');
    if (!form.elements.code.value.trim() && form.dataset.manualCode !== '1') form.elements.code.value = d.code;
  }
  if (!form.reportValidity()) throw new Error('请检查名称和字母编号');
}
async function businessCreate(ev) {

    });

let projectEditorRequest = 0;
async function openProject(id = null) {
  const requestId = ++projectEditorRequest;
  try {
    const [directionData, departmentData, detail] = await Promise.all([
      api('GET', '/api/business-directions'),
      api('GET', '/api/departments'),
      id === null ? null : api('GET', `/api/projects/${id}`),
    ]);
    if (current !== 'projects' || requestId !== projectEditorRequest) return;
    const project = detail?.project;
    const participants = new Set(project?.participants.map(dep => dep.id));
    const departments = departmentData.departments.filter(dep =>
      !dep.disabled || dep.id === project?.lead_department_id || participants.has(dep.id));
    const label = dep => esc(dep.name + (dep.disabled ? '（已停用）' : ''));
    const directions = directionData.business_directions.map(direction =>
      `<option value="${direction.id}" ${direction.id === project?.direction_id ? 'selected' : ''}>${esc(direction.name)}</option>`);
    const leads = departments.map(dep =>
      `<option value="${dep.id}" ${dep.id === project?.lead_department_id ? 'selected' : ''}>${label(dep)}</option>`);
    const checks = departments.map(dep => `<label class="perm-item">
      <input type="checkbox" name="participant" value="${dep.id}" ${!project || participants.has(dep.id) ? 'checked' : ''}>
      ${label(dep)}</label>`).join('');

    openDlg(project ? '编辑项目' : '新建项目', `<form id="project-form">
      <label for="project-name">项目名称</label>
      <input id="project-name" name="name" value="${esc(project?.name || '')}" maxlength="80" required>
      <label for="project-direction">主业务方向</label>
      <select id="project-direction" name="direction_id"><option value="">未指定</option>${directions.join('')}</select>
      <label for="project-lead">牵头部门</label>
      <select id="project-lead" name="lead_department_id"><option value="">未指定</option>${leads.join('')}</select>
      <label id="project-participants">参与部门（可多选）</label>
      <div class="perm-list" role="group" aria-labelledby="project-participants">${checks || '<p class="muted">暂无可选部门</p>'}</div>
      <label for="project-note">备注</label>
      <textarea id="project-note" name="note" rows="3" maxlength="1000">${esc(project?.note || '')}</textarea>
    </form>`, async () => {
      const form = $('#project-form');
      const button = $('#dlg-ok');
      if (button.disabled) throw new Error('正在保存项目');
      if (!form.reportValidity()) throw new Error('请填写项目名称');
      const values = new FormData(form);
      const payload = {
        name: values.get('name').trim(),
        direction_id: Number(values.get('direction_id')) || null,
        lead_department_id: Number(values.get('lead_department_id')) || null,
        participant_department_ids: values.getAll('participant').map(Number),
        note: values.get('note').trim(),
      };
      button.disabled = true;
      try {
        if (project) {
          await api('PUT', `/api/projects/${id}`, {...payload, revision: project.revision});
        } else {
          await api('POST', '/api/projects', payload);
        }
        toast(project ? '项目已更新' : '项目已创建');
        try { await renderProjects(); }
        catch (e) { toast('已保存，列表刷新失败：' + e.message, false); }
      } finally { button.disabled = false; }
    }, project ? '保存修改' : '创建项目');
    $('#dlg-ok').className = '';
    const form = $('#project-form');
    const lead = form.elements.lead_department_id;
    const updateParticipants = () => {
      for (const checkbox of form.querySelectorAll('input[name="participant"]')) {
        checkbox.disabled = checkbox.value === lead.value;
      }
    };
    form.addEventListener('submit', event => {
      event.preventDefault();
      $('#dlg-ok').click();
    });
    lead.addEventListener('change', updateParticipants);
    updateParticipants();
  } catch (e) {
    if (current === 'projects' && requestId === projectEditorRequest) toast(e.message, false);
  }
}

      <td><button class="mini secondary" onclick="depToggle(${dep.id})">${dep.disabled ? '启用' : '停用'}</button>
        <button class="mini danger" ${dep.employees > 0 ? 'disabled title="该部门下仍有员工，请先转移"' : ''}
          onclick="depDelete(${dep.id})">删除</button></td>
    </tr>`).join('');
  $('#view').innerHTML = `<div class="card"><h3>新增部门</h3>
    <form id="department-form" class="business-form" onsubmit="depCreate(event)">
      <div class="business-fields">
        <label class="business-field">部门名称<input name="name" placeholder="例如：研发部" maxlength="32" required></label>
      </div>
      <label class="business-field business-note">备注<textarea name="description" maxlength="1000" rows="3" placeholder="可选，最多 1000 个字符"></textarea></label>
      <div class="business-actions"><button type="submit">创建部门</button></div>
    </form>
    <div class="dash-note">部门创建后不支持编辑名称和备注；停用后不再出现在新员工注册选项中。</div>
  </div>
  <div class="card"><h3>部门列表（${d.departments.length}）</h3><div style="overflow-x:auto">
    <table><tr><th>ID</th><th>部门名称</th><th>备注</th><th>员工数</th><th>状态</th><th>操作</th></tr>
      ${rows || '<tr><td colspan="6" class="empty">还没有部门</td></tr>'}</table>
  </div></div>`;
}
async function depCreate(ev) {
  ev.preventDefault();
  const form = ev.target, button = form.querySelector('button[type="submit"]');
  if (button.disabled) return;
  button.disabled = true;
  try {
    await api('POST', '/api/departments', {name:form.elements.name.value.trim(),
      description:form.elements.description.value.trim()});
    toast('部门已创建'); await renderDeps();
  } catch (e) { toast(e.message, false); }
  finally { button.disabled = false; }
}
async function depToggle(id) {
  try { const r = await api('POST', `/api/departments/${id}/toggle`);
        toast(r.disabled ? '已停用' : '已启用'); renderDeps(); }
  catch (e) { toast(e.message, false); }
}
async function depDelete(id) {
  let dep;
  try { dep=(await api('GET','/api/departments/'+id)).department; }
  catch(e) { toast(e.message,false);return; }
  confirmDo('删除部门',`确认删除部门「${dep.name}」？${dep.employees>0 ? '该部门下仍有员工，请先转移。' : '此操作不可撤销。'}`,
    async()=>{await api('DELETE',`/api/departments/${id}`);toast('部门已删除');await renderDeps();},'删除',true);
}

/* ---------- 员工管理（仅员工；管理员账户在「管理员」标签单独管理） ---------- */
let empFilterDep = '', empSearchInput = '', empPage = 1;
const EMP_PAGE_SIZE = 20;
async function renderEmps() {
  const deps = (await api('GET', '/api/departments')).departments;
  const qs = new URLSearchParams();
  if (empFilterDep) qs.set('dep', empFilterDep);
  if (empSearchInput) qs.set('q', encodeURIComponent(empSearchInput));
  qs.set('page', empPage);
  qs.set('page_size', EMP_PAGE_SIZE);
  const d = await api('GET', '/api/users?' + qs.toString());
  const totalPages = Math.max(1, Math.ceil(d.total / EMP_PAGE_SIZE));
  const rows = d.users.map(u => `
    <tr class="clickable" onclick="empView(${u.id})">
      <td>${u.id}</td><td><b>${esc(u.username)}</b></td>
      <td>${esc(u.real_name) || '—'}</td>
      <td>${esc(u.department) || '—'}</td>
      <td class="wrap">${esc(u.note) || '—'}</td>
      <td>${u.status === 'active' ? '<span class="tag on">启用</span>'
                                  : '<span class="tag off">已停用</span>'}</td>
      <td class="muted">${esc((u.created_at || '').slice(0, 10))}</td>
      <td style="white-space:nowrap">
        <button class="mini ghost" onclick="event.stopPropagation(); empView(${u.id})">详情</button>
        <button class="mini secondary" onclick="event.stopPropagation(); empEdit(${u.id})">编辑</button>
        <button class="mini secondary" onclick="event.stopPropagation(); empPwdDep(${u.id})">密码/部门</button>
      </td>
    </tr>`).join('');
  $('#view').innerHTML = `
    <div class="card">
      <h3>员工管理</h3>
      <div class="toolbar">
        <button type="button" onclick="empCreateDlg()">＋ 新增员工</button>
        <input id="emp-search-input" class="wide"
          placeholder="搜索账户名 / 姓名…" value="${esc(empSearchInput)}">
        <button type="button" onclick="empDoSearch()">🔍 搜索</button>
        <button class="mini secondary" type="button"
          onclick="empSearchInput=''; empPage=1; renderEmps()">清空</button>
        <select onchange="empFilterDep=this.value; empPage=1; renderEmps()">
          <option value="">全部部门</option>
          ${deps.map(x => `<option value="${x.id}" ${String(x.id) === String(empFilterDep)
            ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select>
      </div>
      <div class="muted" style="margin:10px 0">输入账户名或姓名后点「🔍 搜索」（支持回车）。
        点击任意员工行进入<b>详情</b>；「编辑」改姓名/备注/权限/状态；「密码/部门」重置密码与调部门。</div>
      <table><tr><th>ID</th><th>账户名</th><th>姓名</th><th>部门</th><th>备注（职责/职位）</th><th>状态</th><th>创建</th><th>操作</th></tr>
      ${rows || '<tr><td colspan="8" class="empty">没有匹配的员工</td></tr>'}</table>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
        <button class="mini secondary" ${empPage <= 1 ? 'disabled' : ''}
          onclick="empPage--; renderEmps()">上一页</button>
        <span class="muted">第 ${empPage} / ${totalPages} 页（共 ${d.total} 名）</span>
        <button class="mini secondary" ${empPage >= totalPages ? 'disabled' : ''}
          onclick="empPage++; renderEmps()">下一页</button>
      </div>
    </div>`;
  const search = document.querySelector('#emp-search-input');
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') { empSearchInput = search.value.trim(); empPage = 1; renderEmps(); }
  });
}
function empDoSearch() { empPage = 1; renderEmps(); }
function empCreateDlg() {
  const opts = (window._emp_deps || []);
  openDlg('新增员工', `
    <label>账户名（2~32 位字母/数字/下划线/中文，登录用）</label>
    <input id="emp-u">
    <label>姓名（展示用，如：王强）</label>
    <input id="emp-name">
    <label>选择部门</label>
    <select id="emp-dep">
      ${opts.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
    </select>
    <label>备注（职责 / 职位，可选）</label>
    <input id="emp-note" placeholder="如：产品经理 / 负责数据标注">
    <label>初始密码（≥6 位）</label>
    <input id="emp-p1" type="password" value="${genPwd()}">
    <label>确认密码（再次输入，与上面一致）</label>
    <input id="emp-p2" type="password">
    <div class="muted" style="margin-top:6px">创建后可在员工行「详情」里重置密码、调整部门、停用。</div>`,
    async () => {
      const u = document.querySelector('#emp-u').value.trim();
      const name = document.querySelector('#emp-name').value.trim();
      const dep = document.querySelector('#emp-dep').value;
      const note = document.querySelector('#emp-note').value.trim();
      const p1 = document.querySelector('#emp-p1').value;
      const p2 = document.querySelector('#emp-p2').value;
      if (!u || !dep) throw new Error('请填写账户名并选择部门');
      if (p1 !== p2) throw new Error('两次输入的密码不一致');
      if (p1.length < 6) throw new Error('密码至少 6 位');
      await api('POST', '/api/users', { username: u, password: p1,
        department_id: +dep, real_name: name, note });
      toast(`员工「${name || u}」已创建`);
      renderEmps();
    }, '创建');
}
function genPwd() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
  return Array.from({length: 10}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

/* 员工三类操作拆分为三个独立对话框：
   empView（详情只读）/ empEdit（编辑：姓名·备注·权限·状态）/ empPwdDep（密码·部门） */
const PERM_LABELS = { upload: "📤 上传知识", manage: "🗂 知识管理",
                      retrieval_settings: "🔍 检索设置", maintenance: "🧹 知识库维护",
                      plugins: "🔌 插件管理（安装/卸载）", domains: "🧭 领域管理" };

let empDlgRefresh = null;  // 当前打开的员工对话框刷新函数（操作成功后就地刷新，不关窗）

function openEmpDlg(title, bodyHtml, onOk) {
  $('#dlg-title').textContent = title;
  $('#dlg-body').innerHTML = bodyHtml;
  const ok = $('#dlg-ok');
  if (onOk) {
    // 编辑类对话框：确认按钮=保存；保存失败（抛错）时对话框保持打开并提示
    ok.textContent = '保存';
    ok.onclick = async () => {
      try { await onOk(); closeDlg(); renderEmps(); }
      catch (e) { toast(e.message, false); }
    };
  } else {
    // 只读查看类对话框：确认=关闭并刷新列表
    ok.textContent = '关闭';
    ok.onclick = () => { closeDlg(); renderEmps(); };
  }
  const dlg = $('#dlg');
  if (!dlg.open) dlg.showModal();  // 已打开时仅替换内容（就地刷新）
}

async function _fetchEmp(id) {
  const d = await api('GET', `/api/users/${id}`);
  const deps = (await api('GET', '/api/departments')).departments.filter(x => !x.disabled);
  return { u: d.user, d, deps };
}

/* ① 详情（只读） */
async function empView(id) {
  empDlgRefresh = () => empView(id);
  let u, d;
  try { ({ u, d } = await _fetchEmp(id)); }
  catch (e) { toast(e.message, false); return; }
  const perms = Array.isArray(u.permissions) ? u.permissions : [];
  const permTags = perms.length
    ? perms.map(p => `<span class="tag neutral">${PERM_LABELS[p] || p}</span>`).join(" ")
    : '<span class="muted">无（仅检索）</span>';
  openEmpDlg(`员工详情 — ${esc(u.username)}`, `
    <table style="font-size:13px;margin-bottom:8px">
      <tr><td class="muted" style="padding-right:18px">姓名</td>
          <td><b>${esc(u.real_name) || '—'}</b></td></tr>
      <tr><td class="muted">部门</td>
          <td><b>${esc(u.department) || '—'}</b></td></tr>
      <tr><td class="muted">备注（职责/职位）</td>
          <td>${esc(u.note) || '—'}</td></tr>
      <tr><td class="muted">前台权限</td><td>${permTags}</td></tr>
      <tr><td class="muted">状态</td><td>${u.status === 'active'
        ? '<span class="tag on">启用</span>' : '<span class="tag off">已停用</span>'}</td></tr>
      <tr><td class="muted">创建时间</td><td>${esc((u.created_at || '').slice(0, 16))}</td></tr>
      <tr><td class="muted">有效令牌</td><td>${d.valid_tokens} 个
        <span class="muted">（吊销请去「访问令牌」页）</span></td></tr>
    </table>
    <div class="muted">需要修改请用列表里的「编辑」（姓名/备注/权限/状态）
      或「密码/部门」（重置密码、调整部门）。</div>`);
}

/* ② 编辑（姓名 · 备注 · 前台权限 · 状态）——一个保存按钮管全部 */
async function empEdit(id) {
  empDlgRefresh = () => empEdit(id);
  let u;
  try { ({ u } = await _fetchEmp(id)); }
  catch (e) { toast(e.message, false); return; }
  const perms = Array.isArray(u.permissions) ? u.permissions : [];
  const permItems = Object.keys(PERM_LABELS).map(p => `
    <label class="perm-item">
      <input type="checkbox" class="perm-check" value="${p}"
        ${perms.includes(p) ? 'checked' : ''}>
      <span>${PERM_LABELS[p]}</span>
    </label>`).join("");
  openEmpDlg(`编辑员工 — ${esc(u.username)}`, `
    <label>姓名（展示用，如：王强）</label>
    <input id="emp-name-edit" value="${esc(u.real_name || '')}">
    <label>备注（职责 / 职位）</label>
    <input id="emp-note-edit" value="${esc(u.note || '')}"
      placeholder="如：产品经理 / 负责数据标注">
    <label>前台权限（默认无——员工仅可检索；勾选后登录可见对应功能页）</label>
    <div class="perm-list">${permItems}</div>
    <label>状态</label>
    <button class="${u.status === 'active' ? 'danger' : 'secondary'}" type="button"
      onclick="empToggle(${u.id})">${u.status === 'active' ? '停用该员工' : '启用该员工'}</button>`,
    async () => {
      const name = document.querySelector('#emp-name-edit').value.trim();
      const note = document.querySelector('#emp-note-edit').value.trim();
      const perms = [...document.querySelectorAll('.perm-check')]
        .filter(c => c.checked).map(c => c.value);
      await api('POST', `/api/users/${id}/profile`, { real_name: name, note });
      const r = await api('PATCH', `/api/users/${id}/permissions`, { permissions: perms });
      toast(`已保存：${name || '@' + u.username} ｜ 前台权限 ${r.permissions.length} 项`);
      renderEmps();
    }, '保存全部');
}
async function empToggle(uid) {
  try {
    const r = await api('POST', `/api/users/${uid}/toggle`);
    toast(r.warning || (r.status === 'active' ? '已启用' : '已停用'), !r.warning);
    if (empDlgRefresh) empDlgRefresh();
  } catch (e) { toast(e.message, false); }
}

/* ③ 密码 · 部门 */
async function empPwdDep(id) {
  empDlgRefresh = () => empPwdDep(id);
  let u, deps;
  try { ({ u, deps } = await _fetchEmp(id)); }
  catch (e) { toast(e.message, false); return; }
  openEmpDlg(`密码 / 部门 — ${esc(u.username)}`, `
    <label>当前部门</label>
    <div style="margin:2px 0 10px"><b>${esc(u.department) || '—'}</b></div>
    <label>重置密码（已自动生成，重置后吊销其全部令牌并需告知本人）</label>
    <div class="row">
      <input id="emp-newpwd" style="flex:1" value="${genPwd()}">
      <button type="button" onclick="empReset(${u.id})">重置</button>
    </div>
    <label>调整部门</label>
    <div class="row">
      <select id="emp-transfer" style="flex:1">
        ${deps.filter(x => x.id !== u.department_id)
              .map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
      </select>
      <button class="secondary" type="button" onclick="empTransfer(${u.id})">调入</button>
    </div>`);
}
async function empReset(uid) {
  const pwd = document.querySelector('#emp-newpwd').value;
  if (pwd.length < 6) { toast('密码至少 6 位', false); return; }
  try {
    const r = await api('POST', `/api/users/${uid}/reset`, { new_password: pwd });
    toast(r.detail);
    if (empDlgRefresh) empDlgRefresh();
  } catch (e) { toast(e.message, false); }
}
async function empTransfer(uid) {
  const dep = document.querySelector('#emp-transfer').value;
  try {
    const r = await api('POST', `/api/users/${uid}/department`, { department_id: +dep });
    toast(`已调入「${r.department}」`);
    if (empDlgRefresh) empDlgRefresh();
  } catch (e) { toast(e.message, false); }
}
function userResetDlg(id, username) {
  openDlg(`重置密码 — ${username}`,
    `<label>新密码（≥6 位，重置后其全部访问令牌将被吊销）</label>
     <input id="newpwd" value="${genPwd()}">`,
    async () => {
      const pwd = document.querySelector('#newpwd').value;
      if (pwd.length < 6) throw new Error('密码至少 6 位');
      const r = await api('POST', `/api/users/${id}/reset`, { new_password: pwd });
      toast(r.detail);
    }, '重置');
}

/* ---------- 管理员操作日志 ---------- */
let adminOperationFilter = { username: '', action: '', success: '', page: 1, page_size: 20, snapshot_id: 0 };
let adminOperationRequest = 0;
let adminOperationRows = new Map();
function showAdminOperationDetail(id) {
  const row = adminOperationRows.get(id);
  if (!row) return;
  const body = $('#admin-operation-detail-body');
  const field = (label, value) => `<section class="qa-detail-field"><h4>${label}</h4><div class="log-detail">${esc(value ?? '—')}</div></section>`;
  body.innerHTML = `<div class="muted">${esc(row.created_at)} · ${esc(row.username) || '未认证'} · ${esc(row.action_label)}</div>
    ${field('对象', row.target || '—')}
    ${field('说明', row.detail || '—')}
    ${field('结果', `${row.success ? '成功' : '失败'} · HTTP ${row.status_code}`)}
    ${field('IP', row.ip || '—')}
    ${field('耗时', `${row.duration_ms} ms`)}
    ${field('请求方法', row.method || '—')}
    ${field('请求路径', row.path || '—')}
    ${field('浏览器 / 客户端', row.user_agent || '—')}`;
  $('#admin-operation-detail').showModal();
  body.scrollTop = 0;
}
function adminOperationChange(key, value) {
  adminOperationFilter[key] = value;
  adminOperationFilter.page = 1;
  adminOperationFilter.snapshot_id = 0;
  renderAdminOperations().catch(e => toast(e.message, false));
}
function adminOperationPage(delta) {
  adminOperationFilter.page = Math.max(1, adminOperationFilter.page + delta);
  renderAdminOperations().catch(e => toast(e.message, false));
}
async function renderAdminOperations() {
  const requestId = ++adminOperationRequest;
  const qs = new URLSearchParams();
  for (const [key, value] of Object.entries(adminOperationFilter)) {
    if (value !== '') qs.set(key, value);
  }
  const d = await api('GET', '/api/logs/admin-operations?' + qs);
  if (current !== 'adminops' || requestId !== adminOperationRequest) return;
  adminOperationFilter.snapshot_id = d.snapshot_id;
  adminOperationFilter.page = d.page;
  adminOperationRows = new Map(d.logs.map(row => [row.id, row]));
  const rows = d.logs.map(l => `<tr>
    <td class="muted">${esc(l.created_at)}</td>
    <td><b>${esc(l.username) || '未认证'}</b>${l.username && !l.authenticated ? '<br><span class="muted">尝试账户</span>' : ''}</td>
    <td>${esc(l.action_label)}</td><td class="wrap">${esc(l.target) || '—'}</td>
    <td class="wrap">${esc(l.detail) || '—'}</td>
    <td>${l.success ? '<span class="tag on">成功</span>' : '<span class="tag off">失败</span>'}<br><span class="muted">HTTP ${l.status_code}</span></td>
    <td>${esc(l.ip) || '—'}</td><td>${l.duration_ms} ms</td>
    <td><button type="button" class="mini secondary" onclick="showAdminOperationDetail(${l.id})">查看</button></td>
  </tr>`).join('');
  $('#view').innerHTML = `<div class="card">
    <h3>管理员操作日志</h3>
    <div class="toolbar">
      <input aria-label="管理员账户" placeholder="按管理员账户筛选" maxlength="80" value="${esc(adminOperationFilter.username)}"
        onchange="adminOperationChange('username', this.value.trim())">
      <select aria-label="操作类型" onchange="adminOperationChange('action', this.value)">
        <option value="">全部操作</option>
        ${d.actions.map(a => `<option value="${esc(a.value)}" ${a.value === adminOperationFilter.action ? 'selected' : ''}>${esc(a.label)}</option>`).join('')}
      </select>
      <select aria-label="操作结果" onchange="adminOperationChange('success', this.value)">
        <option value="">全部结果</option><option value="true" ${adminOperationFilter.success === 'true' ? 'selected' : ''}>成功</option>
        <option value="false" ${adminOperationFilter.success === 'false' ? 'selected' : ''}>失败</option>
      </select>
      <button class="mini secondary" onclick="adminOperationChange('snapshot_id', 0)">刷新最新日志</button>
    </div>
    <div class="muted" style="margin-bottom:10px">记录新增、编辑、删除、服务启停、令牌签发/吊销，登录登出在管理员登录日志中查看，不记录查看操作。分页保持当前查询范围，点击刷新查看新记录。</div>
    <div style="overflow-x:auto"><table><tr><th>时间</th><th>管理员</th><th>操作</th><th>对象</th><th>说明</th><th>结果</th><th>IP</th><th>耗时</th><th>请求详情</th></tr>
      ${rows || '<tr><td colspan="9" class="empty">暂无符合条件的操作日志</td></tr>'}
    </table></div>
    <div class="toolbar" style="margin-top:12px">
      <button class="mini secondary" ${d.page <= 1 ? 'disabled' : ''} onclick="adminOperationPage(-1)">上一页</button>
      <span class="muted">第 ${d.page} / ${d.total_pages} 页，共 ${d.total} 条</span>
      <button class="mini secondary" ${d.page >= d.total_pages ? 'disabled' : ''} onclick="adminOperationPage(1)">下一页</button>
      <select aria-label="每页条数" onchange="adminOperationChange('page_size', +this.value)">
        ${[20, 50, 100].map(n => `<option value="${n}" ${n === adminOperationFilter.page_size ? 'selected' : ''}>每页 ${n} 条</option>`).join('')}
      </select>
    </div>
  </div>`;

function ingestFilterChange(key, value) {

function ingestOutcome(row) {

function ingestProject(attributes) {

function ingestAccess(attributes, limit = Infinity) {
  const level = attributes.classification;
  const tones = { '公开': 'on', '内部': 'neutral', '受限': 'admin' };
  if (!Object.hasOwn(tones, level)) return '<span class="muted">—</span>';
  const names = level === '内部' ? (attributes.allowed_groups || []).map(key => ingestDepartmentLabels.get(key) || key)
    : (attributes.allowed_users || []).map(name => `@${name}`);
  const unit = level === '内部' ? '部门' : '人';
  const summary = level === '公开' ? '全员可见' : names.length === 0 ? '暂无授权对象'
    : names.slice(0, limit).join('、') + (names.length > limit ? `等 ${names.length} ${unit}` : '');
  return `<div class="ingest-access"><span class="tag ${tones[level]}">${esc(level)}</span>

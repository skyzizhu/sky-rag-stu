<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · Sky Personal RAG</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f4f6fb; color: #1e2430;
         display: flex; min-height: 100vh; }
  .sidebar { width: 224px; flex-shrink: 0; background: #2b3a67; color: #fff;
             display: flex; flex-direction: column; padding: 18px 12px 14px;
             position: sticky; top: 0; height: 100vh; }
  .sidebar .brand { font-weight: 700; font-size: 15px; padding: 4px 10px 16px;
                    border-bottom: 1px solid rgba(255,255,255,.12); line-height: 1.5; }
  .sidebar .brand span { display: block; font-size: 12px; font-weight: 400; color: #cdd6f0; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; overflow-y: auto; }
  .sidebar nav button { text-align: left; background: transparent; color: #cdd6f0;
                        border: 0; font-size: 14px; padding: 9px 14px;
                        border-radius: 8px; cursor: pointer; }
  .sidebar nav button.active { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
  .sidebar nav button:hover { color: #fff; }
  .sidebar .nav-submenu { display: flex; flex-direction: column; gap: 3px; }
  .sidebar .nav-submenu[hidden] { display: none; }
  .sidebar .nav-submenu button { padding-left: 28px; font-size: 13px; white-space: normal; }
  .sidebar .nav-group { display: flex; justify-content: space-between; align-items: center; }
  .sidebar .spacer { flex: 1; }
  .sidebar .who { font-size: 12.5px; color: #cdd6f0; padding: 12px 10px 0;
                  border-top: 1px solid rgba(255,255,255,.12); line-height: 1.9; }
  .sidebar .who b { color: #fff; }
  .sidebar .who a { color: #fff; cursor: pointer; display: inline-block; }
  main { flex: 1; min-width: 0; padding: 22px 26px 60px; }
  .stats { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 160px; background: #fff; border: 1px solid #e3e8f2;
          border-radius: 10px; padding: 12px 16px; cursor: default; }
  .stat b { font-size: 24px; display: block; }
  .stat span { color: #5a6478; font-size: 12px; }
  .card { background: #fff; border: 1px solid #e3e8f2; border-radius: 10px;
          padding: 16px 18px; margin-bottom: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid #ccd3e0;
                                    border-radius: 7px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #edf0f6; text-align: left;
           vertical-align: middle; white-space: nowrap; }
  th { color: #5a6478; font-weight: 600; background: #f8f9fd; position: sticky; top: 0; }
  td.wrap { white-space: normal; max-width: 340px; }
  form.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  input, select, textarea { padding: 7px 10px; border: 1px solid #ccd3e0; border-radius: 7px; font-size: 13.5px; }
  input.wide { width: 260px; }
  button { padding: 7px 14px; border: 0; border-radius: 7px; background: #3d5af1;
           color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button.secondary { background: #eaf1ff; color: #2453b3; border: 1px solid #b8cef2; }
  button.secondary:not(:disabled):hover { background: #dce8ff; border-color: #86a9e6; }
  button:focus-visible { outline: 3px solid #a9c3ff; outline-offset: 2px; }
  button.danger { background: #d64545; }
  button.ghost { background: transparent; color: #3d5af1; border: 1px solid #c3cdF5; }
  button.mini { padding: 4px 10px; font-size: 12.5px; }
  button:disabled { background: #edf0f5; color: #8993a4; border: 1px solid #d9dfe8; opacity: 1; cursor: not-allowed; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.on  { background: #e6f7e9; color: #176b32; }
  .tag.off { background: #fdeaea; color: #a12622; }
  .tag.admin { background: #eceafe; color: #4534ae; }
  .tag.neutral { background: #eef1f8; color: #45516b; }
  .muted { color: #8a93a6; font-size: 12px; }
  .toasts { position: fixed; right: 18px; bottom: 18px; display: flex;
            flex-direction: column; gap: 8px; z-index: 99; }
  .toast { padding: 10px 16px; border-radius: 9px; font-size: 13.5px; color: #fff;
           max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,.18); word-break: break-all; }
  .toast.ok { background: #1f9d55; } .toast.err { background: #d64545; }
  dialog { border: 0; border-radius: 12px; padding: 22px 24px; width: 420px; }
  dialog:has(#business-edit-form) { width: 600px; max-width: calc(100vw - 48px); }
  dialog::backdrop { background: rgba(20,28,50,.45); }
  dialog h3 { margin: 0 0 14px; font-size: 16px; }
  dialog label { display: block; font-size: 12.5px; color: #5a6478; margin: 10px 0 4px; }
  dialog input, dialog select { width: 100%; box-sizing: border-box; }
  dialog textarea { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid #ccd3e0; border-radius: 7px; font-size: 13.5px; font-family: inherit; resize: vertical; }
  dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  dialog .row { display: flex; gap: 8px; align-items: center; }
  dialog .row input { flex: 1; }
  /* 前台权限勾选列表：复选框不继承 width:100%，行内左对齐 */
  dialog .perm-list { border: 1px solid #e3e8f2; border-radius: 8px;
                      padding: 2px 12px; margin: 2px 0 10px; }
  dialog .perm-item { display: flex; align-items: center; gap: 10px;
                      padding: 7px 2px; font-size: 13.5px; }
  dialog .perm-item + .perm-item { border-top: 1px dashed #eef1f8; }
  dialog .perm-item input[type="checkbox"] { width: auto; margin: 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .empty { text-align: center; color: #8a93a6; padding: 26px 0; font-size: 13px; }
  .cost-cards { display: flex; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
  .cost-card { flex: 1; min-width: 160px; background: #f7f8fa; border-radius: 10px;
               padding: 16px 20px; border: 1px solid #e5e8ee; }
  .cost-card .label { color: #6b7688; font-size: 12px; margin-bottom: 6px; }
  .cost-card .value { font-size: 1.7em; font-weight: 700; color: #2c3e50; }
  .cost-card .sub   { color: #8a93a6; font-size: 11px; margin-top: 4px; }
  .cost-card.highlight { background: #eef4ff; border-color: #c8d8f0; }
  .cost-card.highlight .value { color: #2a5db0; }
  .cost-page { display: flex; gap: 8px; align-items: center; justify-content: center;
               margin: 14px 0; }
  .cost-page button { padding: 4px 12px; border: 1px solid #c8d0dc; border-radius: 6px;
                      background: #eaf1ff; color: #2453b3; cursor: pointer; font-size: 13px; }
  .cost-page button:not(:disabled):hover { background: #dce8ff; }
  .cost-page button:disabled { background: #edf0f5; color: #8993a4; border-color: #d9dfe8; cursor: not-allowed; }
  .cost-page button.current:not(:disabled) { background: #2a5db0; color: #fff; border-color: #2a5db0; }
  .cost-page .info { color: #6b7688; font-size: 12px; margin: 0 8px; }
  .log-detail { background: #f8f9fd; border-radius: 8px; padding: 10px 12px; margin-top: 6px;
                font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
  .clickable { cursor: pointer; }
  .clickable:hover td { background: #f6f8ff; }
  .business-form { width: 100%; max-width: 880px; }
  .business-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .business-field { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #45516b; }
  .business-field input { width: 100%; height: 42px; font-size: 14px; }
  .business-form #business-code-hint { margin-top: 9px; color: #64748b; line-height: 1.6; }
  .business-note { margin-top: 18px; }
  .business-note textarea { width: 100%; min-height: 88px; max-height: 240px; resize: vertical; font: inherit; }
  .business-field input:focus, .business-field textarea:focus { border-color: #5278df; outline: 3px solid #e8efff; }
  .business-actions { display: flex; margin-top: 18px; }
  .business-actions button { min-height: 38px; padding: 8px 20px; }
  @media (max-width: 900px) { .business-fields { grid-template-columns: 1fr; gap: 16px; } }
  .dash-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin: 22px 0 12px; }
  .dash-head h3 { margin: 0 0 5px; font-size: 17px; }
  .dash-head .toolbar { margin: 0; }
  .dashboard-counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dashboard-counts .stat { min-width: 0; }
  .dash-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .dash-metric { background: #fff; border: 1px solid #e3e8f2; border-radius: 10px; padding: 14px 16px; }
  .dash-metric span { color: #64748b; font-size: 12px; }
  .dash-metric b { display: block; font-size: 27px; margin-top: 5px; color: #263e71; }
  .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; }
  .dash-grid > .card { min-width: 0; }
  .dash-subtitle { color: #64748b; font-size: 12px; margin: -3px 0 16px; line-height: 1.6; }
  .dash-bars { max-height: 300px; overflow-y: auto; }
  .dash-bar-row { display: grid; grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) 48px; gap: 10px; align-items: center; min-height: 36px; font-size: 13px; }
  .dash-bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-bar-track { background: #f0f4fb; border-radius: 4px; height: 10px; }
  .dash-bar-fill { background: #5277de; border-radius: 4px; height: 100%; }
  .dash-bar-value { text-align: right; color: #334155; font-variant-numeric: tabular-nums; }
  .dash-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .dash-legend button { background: #f2f6ff; color: #334155; padding: 5px 9px; border: 1px solid #d7e3f8; font-size: 12px; }
  .dash-legend button[aria-pressed="false"] { background: #fff; text-decoration: line-through; }
  .dash-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dash-trend { width: 100%; height: auto; display: block; }
  #dash-trend-area { position: relative; }
  .dash-point-hit { fill: transparent; cursor: crosshair; outline: none; }
  .dash-point:hover .dash-point-dot, .dash-point:focus-within .dash-point-dot { r: 5; stroke: #fff; stroke-width: 2; }
  .dash-tooltip { position: absolute; z-index: 10; pointer-events: none; min-width: 156px;
    padding: 11px 13px; border: 1px solid #d7e3f8; border-radius: 9px; background: #fff;
    color: #334155; font-size: 12px; box-shadow: 0 5px 20px rgba(35, 55, 98, .14); }
  .dash-tooltip > b { display: block; margin-bottom: 8px; }
  .dash-tip-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 6px; }
  .dash-channels { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 16px; }
  .dash-channel { flex: 1; min-width: 100px; border: 1px solid #e3e8f2; border-radius: 8px; padding: 12px; }
  .dash-channel b { display: block; font-size: 22px; color: #263e71; margin-top: 5px; }
  .dash-note { color: #64748b; font-size: 12px; line-height: 1.7; margin-top: 8px; }
  @media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } .dash-trend text { font-size: 14px; } }
  @media (max-width: 1000px) { .dashboard-counts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 800px) { .dash-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash-trend text { font-size: 16px; } }
  .hidden { display: none; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">🛡 Sky Personal RAG<span>管理后台</span></div>
  <nav id="tabs"></nav>
  <span class="spacer"></span>
  <div class="who">👤 <b>{{ admin['username'] }}</b><br>
    <a onclick="logout()">↩ 退出登录</a></div>
</aside>
<main>
  <div id="view"></div>
</main>
<div class="toasts" id="toasts"></div>

<dialog id="dlg">
  <h3 id="dlg-title"></h3>
  <div id="dlg-body"></div>
  <div class="actions">
    <button class="secondary" onclick="closeDlg()">取消</button>
    <button id="dlg-ok" type="button">确认</button>
  </div>
</dialog>

<script>
const $ = sel => document.querySelector(sel);
const me = "{{ admin['username'] }}";  // 当前登录管理员
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ok ? 3200 : 5200);
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json';
                            opt.body = JSON.stringify(body); }
  const resp = await fetch(path, opt);
  if (resp.status === 401) { location.href = '/admin/login?err=' +
    encodeURIComponent('会话已过期，请重新登录'); throw new Error('unauthorized'); }
  let data = {};
  try { data = await resp.json(); } catch (e) {}
  if (!resp.ok || data.ok === false) {
    throw new Error(data.detail || ('请求失败（' + resp.status + '）'));
  }
  return data;
}

/* ---------- 对话框 ---------- */
let dlgConfirm = null;
function openDlg(title, bodyHtml, onOk, okText = '确认') {
  $('#dlg-title').textContent = title;
  $('#dlg-body').innerHTML = bodyHtml;
  const ok = $('#dlg-ok');
  ok.textContent = okText;
  ok.onclick = async () => { try { await onOk(); closeDlg(); }
                             catch (e) { toast(e.message, false); } };
  const dlg = $('#dlg');
  if (!dlg.open) dlg.showModal();  // 已打开时仅替换内容（员工对话框就地刷新用）
}
function closeDlg() { $('#dlg').close(); dlgConfirm = null; }

function confirmDo(title, msg, fn, okText = '确认', danger = false) {
  openDlg(title, `<div class="log-detail">${esc(msg)}</div>`, fn,
          okText);
  if (danger) $('#dlg-ok').className = 'danger'; else $('#dlg-ok').className = '';
}

/* ---------- 标签页框架 ---------- */
const TABS = [
  { id: 'dash',    name: '工作台',     render: renderDash },
  { id: 'deps',    name: '部门管理',   render: renderDeps },
  { id: 'business', name: '业务方向', render: renderBusinessDirections },
  { id: 'emps',    name: '员工管理',   render: renderEmps },
  { id: 'admins',  name: '管理员',     render: renderAdmins },
  { id: 'tokens',  name: 'MCP访问令牌', render: renderTokens },
  { id: 'logs', name: '日志', children: [
    { id: 'adminauth', name: '管理员登录日志', render: renderAdminLoginLog },
    { id: 'adminops', name: '管理员操作日志', render: renderAdminOperations },
    { id: 'authlog', name: '员工登录日志', render: renderAuthLog },
    { id: 'qalog', name: '员工检索日志', render: renderQaLog },
  ] },
  { id: 'llmcost', name: 'LLM 费用',   render: renderLlmCost },
  { id: 'services', name: '服务状态',  render: renderServices },
];
let current = 'dash';
let svcBusy = false;  // 服务控制动作进行中：防重复点击，按钮按当前状态禁用

let logsMenuOpen = false;
function renderNavigation() {
  const leaf = tab => `<button type="button" data-id="${tab.id}" class="${current === tab.id ? 'active' : ''}"
    ${current === tab.id ? 'aria-current="page"' : ''} onclick="switchTab('${tab.id}')">${esc(tab.name)}</button>`;
  $('#tabs').innerHTML = TABS.map(tab => {
    if (!tab.children) return leaf(tab);
    const active = tab.children.some(child => child.id === current);
    return `<button type="button" data-id="${tab.id}" class="nav-group ${active ? 'active' : ''}"
      aria-expanded="${logsMenuOpen}" aria-controls="logs-submenu" onclick="toggleLogsMenu()">
        ${esc(tab.name)}<span aria-hidden="true">${logsMenuOpen ? '▾' : '▸'}</span></button>
      <div id="logs-submenu" class="nav-submenu" ${logsMenuOpen ? '' : 'hidden'}>
        ${tab.children.map(leaf).join('')}
      </div>`;
  }).join('');
}
function toggleLogsMenu() {
  logsMenuOpen = !logsMenuOpen;
  renderNavigation();
}
function switchTab(id) {
  const tab = TABS.flatMap(item => item.children || [item]).find(item => item.id === id);
  if (!tab) return;
  current = id;
  if (TABS.some(item => item.children?.some(child => child.id === id))) logsMenuOpen = true;
  renderNavigation();
  $('#view').innerHTML = '<div class="empty">加载中…</div>';
  return tab.render().catch(e => {
    if (current === id) $('#view').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  });
}

async function logout() {
  // 退出前确认：防误触（登录日志会完整记录本次登出）
  openDlg('确认退出登录', '<div class="log-detail">退出后需要重新输入账户密码才能再次进入管理后台。确认退出吗？</div>',
    async () => { await fetch('/admin/logout'); location.href = '/admin/login'; },
    '确认退出');
}

/* ---------- 工作台 ---------- */
let dashboardDays = 30;
let dashboardRequest = 0;
let dashboardData = null;
let dashboardVisible = {web: true, mcp: true, other: true};
const dashboardColors = {web: '#4263d7', mcp: '#0c9488', other: '#9b6bce'};
const dashNum = n => Math.max(0, Number(n) || 0).toLocaleString();
function dashboardBars(rows, key, emptyText) {
  if (!rows.length) return `<div class="empty">${esc(emptyText)}</div>`;
  const max = Math.max(1, ...rows.map(row => Number(row[key]) || 0));
  return `<div class="dash-bars">${rows.map(row => `<div class="dash-bar-row">
    <span class="dash-bar-name" title="${esc(row.name)}">${esc(row.name)}</span>
    <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${Math.max(0, Number(row[key]) || 0) / max * 100}%"></div></div>
    <span class="dash-bar-value">${dashNum(row[key])}</span></div>`).join('')}</div>`;
}
function dashboardToggleChannel(key) {
  dashboardVisible[key] = !dashboardVisible[key];
  $('#dash-trend-area').innerHTML = dashboardTrend(dashboardData);
}
function dashboardHideTooltip() {
  const tip = document.querySelector('#dash-trend-tooltip');
  if (tip) tip.hidden = true;
  const guide = document.querySelector('#dash-trend-guide');
  if (guide) guide.style.display = 'none';
}
function dashboardMoveOnChart(event) {
  const rect = event.currentTarget.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width * 760;
  const y = (event.clientY - rect.top) / rect.height * 250;
  if (x < 34 || x > 744 || y < 8 || y > 218 || !dashboardData?.daily.length) {
    dashboardHideTooltip();
    return;
  }
  const index = Math.max(0, Math.min(dashboardData.daily.length - 1,
    Math.round((x - 44) / 690 * (dashboardData.daily.length - 1))));
  dashboardShowTooltip(event, index);
}
function dashboardShowTooltip(event, index) {
  const area = document.querySelector('#dash-trend-area');
  const tip = document.querySelector('#dash-trend-tooltip');
  const day = dashboardData?.daily[index];
  if (!area || !tip || !day) return;
  const channels = dashboardData.channels.filter(c => dashboardVisible[c.key] && (c.key !== 'other' || c.requests > 0));
  tip.innerHTML = `<b>${esc(day.date)}</b>${channels.map(c => `<div class="dash-tip-row">
    <span><span class="dash-dot" style="background:${dashboardColors[c.key]}"></span>${esc(c.name)}</span>
    <strong>${dashNum(day[c.key])} 次</strong></div>`).join('')}`;
  tip.hidden = false;
  const bounds = area.getBoundingClientRect();
  const point = event.currentTarget.tagName.toLowerCase() === 'svg'
    ? {right: event.clientX, top: event.clientY, bottom: event.clientY}
    : event.currentTarget.getBoundingClientRect();
  const left = point.right - bounds.left + 10;
  const top = point.top - bounds.top - tip.offsetHeight - 10;
  tip.style.left = Math.max(0, Math.min(left, area.clientWidth - tip.offsetWidth)) + 'px';
  tip.style.top = Math.max(0, top < 0 ? point.bottom - bounds.top + 10 : top) + 'px';
  const guide = document.querySelector('#dash-trend-guide');
  if (guide) {
    const x = 44 + index / Math.max(1, dashboardData.daily.length - 1) * 690;
    guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.style.display = 'block';
  }
}
function dashboardTrend(stats) {
  const channels = stats.channels.filter(c => c.key !== 'other' || c.requests > 0);
  const legend = `<div class="dash-legend">${channels.map(c => `<button type="button" aria-pressed="${dashboardVisible[c.key]}"
    onclick="dashboardToggleChannel('${c.key}')"><span class="dash-dot" style="background:${dashboardColors[c.key]}"></span>${esc(c.name)} · ${dashNum(c.requests)} 次</button>`).join('')}</div>`;
  const shown = channels.filter(c => dashboardVisible[c.key]);
  if (!stats.requests || !shown.length) return legend + `<div class="empty">${stats.requests ? '请选择要显示的入口' : '所选时间内暂无检索记录'}</div>`;
  const daily = stats.daily, left = 44, top = 18, width = 690, height = 190;
  const maximum = Math.max(4, Math.ceil(Math.max(...daily.flatMap(d => shown.map(c => d[c.key] || 0))) / 4) * 4);
  const x = i => left + i / Math.max(1, daily.length - 1) * width;
  const y = value => top + height - value / maximum * height;
  let parts = [];
  for (let i = 0; i <= 4; i++) {
    const value = maximum / 4 * i;
    parts.push(`<line x1="${left}" y1="${y(value)}" x2="${left + width}" y2="${y(value)}" stroke="#e5eaf3"/>
      <text x="${left - 9}" y="${y(value) + 4}" text-anchor="end" fill="#64748b" font-size="11">${value}</text>`);
  }
  const labels = new Set([0, daily.length - 1, ...daily.map((_, i) => i).filter(i => i % Math.max(1, Math.ceil(daily.length / 6)) === 0)]);
  for (const i of labels) parts.push(`<text x="${x(i)}" y="235" text-anchor="middle" fill="#64748b" font-size="11">${esc(daily[i].date.slice(5))}</text>`);
  for (const c of shown) {
    parts.push(`<polyline points="${daily.map((d, i) => `${x(i)},${y(d[c.key] || 0)}`).join(' ')}" fill="none" stroke="${dashboardColors[c.key]}" stroke-width="2.5" stroke-linejoin="round"/>`);
    for (let i = 0; i < daily.length; i++) parts.push(`<g class="dash-point">
      <circle class="dash-point-dot" cx="${x(i)}" cy="${y(daily[i][c.key] || 0)}" r="3.5" fill="${dashboardColors[c.key]}" pointer-events="none"/>
      <circle class="dash-point-hit" cx="${x(i)}" cy="${y(daily[i][c.key] || 0)}" r="10" tabindex="0"
        aria-label="${esc(daily[i].date)} ${esc(c.name)}：${dashNum(daily[i][c.key])} 次" aria-describedby="dash-trend-tooltip"
        onpointerenter="dashboardShowTooltip(event, ${i})" onpointermove="dashboardShowTooltip(event, ${i})"
        onpointerleave="dashboardHideTooltip()" onfocus="dashboardShowTooltip(event, ${i})" onblur="dashboardHideTooltip()"
        onkeydown="if(event.key === 'Escape') dashboardHideTooltip()"/>
    </g>`);
  }
  return legend + `<svg class="dash-trend" viewBox="0 0 760 250" role="img" aria-label="员工每日检索次数，按 Web 和 MCP 区分"
    onpointermove="dashboardMoveOnChart(event)" onpointerleave="dashboardHideTooltip()">
    <line id="dash-trend-guide" y1="18" y2="208" stroke="#b8c5df" stroke-dasharray="4 4" pointer-events="none" style="display:none"/>
    ${parts.join('')}</svg><div id="dash-trend-tooltip" class="dash-tooltip" role="tooltip" hidden></div>`;
}

function serviceStatusTable(services, busy) {
  const rows = services.map(s => {
    const running = s.ok;
    const btn = (label, action, enabled) =>
      `<button type="button" class="mini" onclick="svcAct('${s.key}','${action}')"${enabled ? '' : ' disabled'}>${label}</button>`;
    return `
    <tr><td><b>${esc(s.name)}</b></td>
    <td>${s.ok ? '<span class="tag on">🟢 运行中</span>' : '<span class="tag off">🔴 未运行</span>'}</td>
    <td>${btn('开启', 'start', !running && !busy)} ${btn('停止', 'stop', running && !busy)}</td></tr>`;
  }).join('');
  return `<table><tr><th>服务</th><th>状态</th><th>操作</th></tr>${rows}</table>`;
}

async function fetchServices() {
  return await api('GET', '/api/services');
}

function updateServiceRows(services) {
  const box = $('#svc-status-box');
  if (box) box.innerHTML = serviceStatusTable(services, svcBusy);

    </div>

        <button type="button" class="danger" onclick="svcRestart()">🔄 一键重启所有服务</button>
        <button type="button" class="danger" onclick="svcStop()">🛑 一键关闭所有服务</button>
      </div>
      <div class="muted" style="margin-top:8px">关闭后重新启动：在服务器上运行 start.bat，或服务恢复后回到本页点击一键重启。</div>
    </div>`;

/* 轮询服务状态直到满足条件（重启后全部恢复 / 停止后全部停掉）。
   重启窗口期内后台自身会短暂不可达，请求失败属预期，继续轮询。 */
async function pollServices(matcher, maxMs = 45000) {
  const start = Date.now();
  while (Date.now() - start < maxMs) {
    await new Promise(r => setTimeout(r, 4000));
    let services = null;
    try {
      const d = await fetchServices();
      services = d.services;
      updateServiceRows(services);
    } catch (e) { /* 服务重启窗口期：不可达属预期 */ }
    if (services && matcher(services)) return true;
  }
  return false;
}

/* 单服务开启/停止：收到指令后等待实际状态变化，不提前宣称操作成功。 */
function svcAct(key, action) {
  if (svcBusy) return;
  if (action === 'stop') {
    const message = key === 'admin'
      ? '停止管理后台后，本页面将无法访问。需要在电脑上重新启动后台或运行 start.bat，才能再次进入。确认停止吗？'
      : '停止此服务会影响正在进行的问答或入库任务。确认停止吗？';
    confirmDo('确认停止服务', message, () => runServiceAction(key, action), '确认停止', true);
    return;
  }
  return runServiceAction(key, action);
}

async function runServiceAction(key, action) {
  if (svcBusy) return;
  svcBusy = true;
  document.querySelectorAll('#svc-status-box button').forEach(b => { b.disabled = true; });
  try {
    await api('POST', `/api/services/${key}/${action}`);
    closeDlg();
    if (key === 'admin' && action === 'stop') {
      const row = $('#svc-status-box');
      if (row) row.innerHTML = '<div class="empty">后台停止指令已发出，本页面即将无法访问。请在电脑上重新启动后台后再刷新。</div>';
      toast('后台停止指令已发出');
      return;
    }
    toast(action === 'start' ? '开启指令已发出，正在等待服务就绪…' : '停止指令已发出，正在等待状态更新…');
    const reached = await pollServices(list => {
      const service = list.find(s => s.key === key);
      return service && service.ok === (action === 'start');
    });
    if (current === 'services') await renderServices();
    toast(reached ? (action === 'start' ? '服务已开启' : '服务已停止') : '服务状态尚未达到预期，请查看日志或稍后刷新', reached);
  } catch (e) {
    toast(e.message || '操作失败，请检查后台连接', false);
  } finally {
    svcBusy = false;
    if (current === 'services' && !(key === 'admin' && action === 'stop')) {
      try { await renderServices(); } catch (e) {}
    }
  }
}

async function svcRestart() {
  confirmDo('确认重启所有服务',
    '全部服务（Qdrant / Ollama / 前台 / 管理后台）将停止并按序重新拉起，'
    + '约 15 秒恢复；本管理后台会随之短暂中断，之后状态自动刷新。确认重启吗？',
    async () => {
      try { await api('POST', '/api/services/restart'); } catch (e) {}
      $('#view').innerHTML = '<div class="empty">🔄 正在重启所有服务（约 15 秒），状态自动刷新中…</div>';
      const allUp = await pollServices(list => list.every(s => s.ok));
      await renderServices();
      toast(allUp ? '所有服务已恢复运行 ✅' : '部分服务尚未就绪，请稍后刷新查看', allUp);
    }, '确认重启');
}

function businessNameChanged(form) {
  clearTimeout(businessCodeTimer);
  const name = form.elements.name.value.trim();
  if (form.dataset.manualCode === '1') return;
  // 清空旧预览：名称改变后立即提交时，由服务端生成新名称对应的编号。
  form.elements.code.value = '';
  if (!name) return;
  businessCodeTimer = setTimeout(async () => {
    try {
      const d = await api('GET', (form.dataset.codeEndpoint || '/api/business-directions/suggest-code') + '?name=' + encodeURIComponent(name));
      if (form.isConnected && form.elements.name.value.trim() === name && form.dataset.manualCode !== '1') {
        form.elements.code.value = d.code;
        const hint = form.querySelector('.business-code-hint');
        if (hint) hint.textContent = '已自动生成拼音，可手动调整；名称和编号均不可重复。';
      }
    } catch (e) {
      if (form.isConnected && form.elements.name.value.trim() === name && form.dataset.manualCode !== '1') {
        const hint = form.querySelector('.business-code-hint');
        if (hint) hint.textContent = e.message + '；也可以手动填写字母编号。';
      }
    }
  }, 250);
}
async function prepareAutomaticCode(form) {
  if (!form.elements.name.reportValidity()) throw new Error('请检查名称');
  clearTimeout(businessCodeTimer);
  if (!form.elements.code.value.trim() && form.dataset.manualCode !== '1') {
    // 名称输入后立即保存，也要等待新名称对应的拼音，不能提交旧编号。
    const name = form.elements.name.value.trim();
    const d = await api('GET', (form.dataset.codeEndpoint || '/api/business-directions/suggest-code') + '?name=' + encodeURIComponent(name));
    if (!form.isConnected) throw new Error('编辑窗口已关闭，请重新确认后保存');
    if (form.elements.name.value.trim() !== name) throw new Error('名称已变化，请确认后重新保存');
    if (!form.elements.code.value.trim() && form.dataset.manualCode !== '1') form.elements.code.value = d.code;
  }
  if (!form.reportValidity()) throw new Error('请检查名称和字母编号');
}

  qs.set('page', empPage);
  qs.set('page_size', EMP_PAGE_SIZE);
  const d = await api('GET', '/api/users?' + qs.toString());

    <tr class="clickable" onclick="empView(${u.id})">

  $('#view').innerHTML = `
    <div class="card">
      <div class="toolbar">
        <button type="button" onclick="empCreateDlg()">＋ 新增员工</button>
        <input id="emp-search-input" class="wide"
          placeholder="搜索账户名 / 姓名…" value="${esc(empSearchInput)}">
        <button type="button" onclick="empDoSearch()">🔍 搜索</button>
        <button class="mini secondary" type="button"
          onclick="empSearchInput=''; empPage=1; renderEmps()">清空</button>
        <select onchange="empFilterDep=this.value; empPage=1; renderEmps()">
          <option value="">全部部门</option>
          ${deps.map(x => `<option value="${x.id}" ${String(x.id) === String(empFilterDep)
            ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select>
      </div>
      <div class="muted" style="margin:10px 0">输入账户名或姓名后点「🔍 搜索」（支持回车）。
        点击任意员工行进入<b>详情</b>；「编辑」改姓名/备注/权限/状态；「密码/部门」重置密码与调部门。</div>
      <table><tr><th>ID</th><th>账户名</th><th>姓名</th><th>部门</th><th>备注（职责/职位）</th><th>状态</th><th>创建</th><th>操作</th></tr>
      ${rows || '<tr><td colspan="8" class="empty">没有匹配的员工</td></tr>'}</table>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
        <button class="mini secondary" ${empPage <= 1 ? 'disabled' : ''}
          onclick="empPage--; renderEmps()">上一页</button>
        <span class="muted">第 ${empPage} / ${totalPages} 页（共 ${d.total} 名）</span>
        <button class="mini secondary" ${empPage >= totalPages ? 'disabled' : ''}
          onclick="empPage++; renderEmps()">下一页</button>
      </div>
    </div>`;
  const search = document.querySelector('#emp-search-input');
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') { empSearchInput = search.value.trim(); empPage = 1; renderEmps(); }

function empDoSearch() { empPage = 1; renderEmps(); }
function empCreateDlg() {

      const name = document.querySelector('#emp-name').value.trim();
      const dep = document.querySelector('#emp-dep').value;

      const p1 = document.querySelector('#emp-p1').value;

function genPwd() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
  return Array.from({length: 10}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

/* 员工三类操作拆分为三个独立对话框：
   empView（详情只读）/ empEdit（编辑：姓名·备注·权限·状态）/ empPwdDep（密码·部门） */
const PERM_LABELS = { upload: "📤 上传知识", manage: "🗂 知识管理",
                      retrieval_settings: "🔍 检索设置", maintenance: "🧹 知识库维护",
                      plugins: "🔌 插件管理（安装/卸载）", domains: "🧭 领域管理" };

let empDlgRefresh = null;  // 当前打开的员工对话框刷新函数（操作成功后就地刷新，不关窗）

function openEmpDlg(title, bodyHtml, onOk) {
  $('#dlg-title').textContent = title;
  $('#dlg-body').innerHTML = bodyHtml;
  const ok = $('#dlg-ok');
  if (onOk) {
    // 编辑类对话框：确认按钮=保存；保存失败（抛错）时对话框保持打开并提示
    ok.textContent = '保存';
    ok.onclick = async () => {
      try { await onOk(); closeDlg(); renderEmps(); }
      catch (e) { toast(e.message, false); }
    };
  } else {
    // 只读查看类对话框：确认=关闭并刷新列表
    ok.textContent = '关闭';
    ok.onclick = () => { closeDlg(); renderEmps(); };
  }
  const dlg = $('#dlg');
  if (!dlg.open) dlg.showModal();  // 已打开时仅替换内容（就地刷新）
}

async function _fetchEmp(id) {
  const d = await api('GET', `/api/users/${id}`);
  const deps = (await api('GET', '/api/departments')).departments.filter(x => !x.disabled);
  return { u: d.user, d, deps };
}

/* ① 详情（只读） */
async function empView(id) {
  empDlgRefresh = () => empView(id);
  let u, d;
  try { ({ u, d } = await _fetchEmp(id)); }
  catch (e) { toast(e.message, false); return; }
  const perms = Array.isArray(u.permissions) ? u.permissions : [];
  const permTags = perms.length
    ? perms.map(p => `<span class="tag neutral">${PERM_LABELS[p] || p}</span>`).join(" ")
    : '<span class="muted">无（仅检索）</span>';
  openEmpDlg(`员工详情 — ${esc(u.username)}`, `
    <table style="font-size:13px;margin-bottom:8px">
      <tr><td class="muted" style="padding-right:18px">姓名</td>
          <td><b>${esc(u.real_name) || '—'}</b></td></tr>
      <tr><td class="muted">部门</td>
          <td><b>${esc(u.department) || '—'}</b></td></tr>

    </table>
    <div class="muted">需要修改请用列表里的「编辑」（姓名/备注/权限/状态）
      或「密码/部门」（重置密码、调整部门）。</div>`);
}

/* ② 编辑（姓名 · 备注 · 前台权限 · 状态）——一个保存按钮管全部 */
async function empEdit(id) {
  empDlgRefresh = () => empEdit(id);
  let u;
  try { ({ u } = await _fetchEmp(id)); }
  catch (e) { toast(e.message, false); return; }
  const perms = Array.isArray(u.permissions) ? u.permissions : [];
  const permItems = Object.keys(PERM_LABELS).map(p => `
    <label class="perm-item">
      <input type="checkbox" class="perm-check" value="${p}"
        ${perms.includes(p) ? 'checked' : ''}>
      <span>${PERM_LABELS[p]}</span>
    </label>`).join("");
  openEmpDlg(`编辑员工 — ${esc(u.username)}`, `
    <label>姓名（展示用，如：王强）</label>
    <input id="emp-name-edit" value="${esc(u.real_name || '')}">
    <label>备注（职责 / 职位）</label>
    <input id="emp-note-edit" value="${esc(u.note || '')}"
      placeholder="如：产品经理 / 负责数据标注">
    <label>前台权限（默认无——员工仅可检索；勾选后登录可见对应功能页）</label>
    <div class="perm-list">${permItems}</div>
    <label>状态</label>
    <button class="${u.status === 'active' ? 'danger' : 'secondary'}" type="button"
      onclick="empToggle(${u.id})">${u.status === 'active' ? '停用该员工' : '启用该员工'}</button>`,
    async () => {
      const name = document.querySelector('#emp-name-edit').value.trim();
      const note = document.querySelector('#emp-note-edit').value.trim();
      const perms = [...document.querySelectorAll('.perm-check')]
        .filter(c => c.checked).map(c => c.value);
      await api('POST', `/api/users/${id}/profile`, { real_name: name, note });
      const r = await api('PATCH', `/api/users/${id}/permissions`, { permissions: perms });
      toast(`已保存：${name || '@' + u.username} ｜ 前台权限 ${r.permissions.length} 项`);
      renderEmps();
    }, '保存全部');
}
async function empToggle(uid) {
  try {
    const r = await api('POST', `/api/users/${uid}/toggle`);
    toast(r.status === 'active' ? '已启用' : '已停用');
    if (empDlgRefresh) empDlgRefresh();
  } catch (e) { toast(e.message, false); }
}

/* ③ 密码 · 部门 */
async function empPwdDep(id) {
  empDlgRefresh = () => empPwdDep(id);
  let u, deps;
  try { ({ u, deps } = await _fetchEmp(id)); }
  catch (e) { toast(e.message, false); return; }
  openEmpDlg(`密码 / 部门 — ${esc(u.username)}`, `
    <label>当前部门</label>
    <div style="margin:2px 0 10px"><b>${esc(u.department) || '—'}</b></div>
    <label>重置密码（已自动生成，重置后吊销其全部令牌并需告知本人）</label>

async function empReset(uid) {
  const pwd = document.querySelector('#emp-newpwd').value;
  if (pwd.length < 6) { toast('密码至少 6 位', false); return; }
  try {
    const r = await api('POST', `/api/users/${uid}/reset`, { new_password: pwd });
    toast(r.detail);
    if (empDlgRefresh) empDlgRefresh();
  } catch (e) { toast(e.message, false); }
}
async function empTransfer(uid) {
  const dep = document.querySelector('#emp-transfer').value;
  try {
    const r = await api('POST', `/api/users/${uid}/department`, { department_id: +dep });
    toast(`已调入「${r.department}」`);
    if (empDlgRefresh) empDlgRefresh();
  } catch (e) { toast(e.message, false); }
}
function userResetDlg(id, username) {
  openDlg(`重置密码 — ${username}`,
    `<label>新密码（≥6 位，重置后其全部访问令牌将被吊销）</label>
     <input id="newpwd" value="${genPwd()}">`,
    async () => {
      const pwd = document.querySelector('#newpwd').value;

    }, '重置');
}

/* ---------- 管理员操作日志 ---------- */
let adminOperationFilter = { username: '', action: '', success: '', page: 1, page_size: 20, snapshot_id: 0 };
let adminOperationRequest = 0;
function adminOperationChange(key, value) {
  adminOperationFilter[key] = value;
  adminOperationFilter.page = 1;
  adminOperationFilter.snapshot_id = 0;
  renderAdminOperations().catch(e => toast(e.message, false));
}
function adminOperationPage(delta) {
  adminOperationFilter.page = Math.max(1, adminOperationFilter.page + delta);
  renderAdminOperations().catch(e => toast(e.message, false));
}
async function renderAdminOperations() {
  const requestId = ++adminOperationRequest;
  const qs = new URLSearchParams();
  for (const [key, value] of Object.entries(adminOperationFilter)) {
    if (value !== '') qs.set(key, value);
  }
  const d = await api('GET', '/api/logs/admin-operations?' + qs);
  if (current !== 'adminops' || requestId !== adminOperationRequest) return;
  adminOperationFilter.snapshot_id = d.snapshot_id;
  adminOperationFilter.page = d.page;
  const rows = d.logs.map(l => `<tr>
    <td class="muted">${esc(l.created_at)}</td>
    <td><b>${esc(l.username) || '未认证'}</b>${l.username && !l.authenticated ? '<br><span class="muted">尝试账户</span>' : ''}</td>
    <td>${esc(l.action_label)}</td><td class="wrap">${esc(l.target) || '—'}</td>
    <td class="wrap">${esc(l.detail) || '—'}</td>
    <td>${l.success ? '<span class="tag on">成功</span>' : '<span class="tag off">失败</span>'}<br><span class="muted">HTTP ${l.status_code}</span></td>
    <td>${esc(l.ip) || '—'}</td><td>${l.duration_ms} ms</td>
    <td><details><summary>查看</summary><div class="wrap mono">${esc(l.method)} ${esc(l.path)}<br>${esc(l.user_agent)}</div></details></td>
  </tr>`).join('');
  $('#view').innerHTML = `<div class="card">
    <h3>管理员操作日志</h3>
    <div class="toolbar">
      <input aria-label="管理员账户" placeholder="按管理员账户筛选" maxlength="80" value="${esc(adminOperationFilter.username)}"
        onchange="adminOperationChange('username', this.value.trim())">
      <select aria-label="操作类型" onchange="adminOperationChange('action', this.value)">
        <option value="">全部操作</option>
        ${d.actions.map(a => `<option value="${esc(a.value)}" ${a.value === adminOperationFilter.action ? 'selected' : ''}>${esc(a.label)}</option>`).join('')}
      </select>
      <select aria-label="操作结果" onchange="adminOperationChange('success', this.value)">
        <option value="">全部结果</option><option value="true" ${adminOperationFilter.success === 'true' ? 'selected' : ''}>成功</option>
        <option value="false" ${adminOperationFilter.success === 'false' ? 'selected' : ''}>失败</option>
      </select>
      <button class="mini secondary" onclick="adminOperationChange('snapshot_id', 0)">刷新最新日志</button>
    </div>
    <div class="muted" style="margin-bottom:10px">记录新增、编辑、删除、服务启停、令牌签发/吊销，登录登出在管理员登录日志中查看，不记录查看操作。分页保持当前查询范围，点击刷新查看新记录。</div>
    <div style="overflow-x:auto"><table><tr><th>时间</th><th>管理员</th><th>操作</th><th>对象</th><th>说明</th><th>结果</th><th>IP</th><th>耗时</th><th>请求详情</th></tr>
      ${rows || '<tr><td colspan="9" class="empty">暂无符合条件的操作日志</td></tr>'}
    </table></div>
    <div class="toolbar" style="margin-top:12px">
      <button class="mini secondary" ${d.page <= 1 ? 'disabled' : ''} onclick="adminOperationPage(-1)">上一页</button>
      <span class="muted">第 ${d.page} / ${d.total_pages} 页，共 ${d.total} 条</span>
      <button class="mini secondary" ${d.page >= d.total_pages ? 'disabled' : ''} onclick="adminOperationPage(1)">下一页</button>
      <select aria-label="每页条数" onchange="adminOperationChange('page_size', +this.value)">
        ${[20, 50, 100].map(n => `<option value="${n}" ${n === adminOperationFilter.page_size ? 'selected' : ''}>每页 ${n} 条</option>`).join('')}
      </select>
    </div>
  </div>`;
}

let lastToken = '';
async function tokenCreate(ev) {
  ev.preventDefault();
  const f = ev.target;
  try {
    const r = await api('POST', '/api/tokens', { username: f.username.value,
                                                 name: f.name.value.trim() });
    lastToken = r.plaintext;
    toast('令牌已签发，请立即复制保存');
    renderTokens();
  } catch (e) { toast(e.message, false); }
  return false;
}
async function tokenRevoke(prefix) {
  confirmDo('吊销令牌', `确认吊销令牌 ${prefix}…？该 Agent 接入将立即失效。`,
    async () => { await api('POST', '/api/tokens/revoke?token_prefix=' + encodeURIComponent(prefix));
                  toast('令牌已吊销'); renderTokens(); }, '吊销', true);
}
/* 剪贴板复制：优先 Clipboard API，非安全上下文（如 http://局域网IP 访问）降级 execCommand */
function copyText(text, note) {
  const done = () => toast(note || '已复制到剪贴板');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    return;
  }
  fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    done();
  } catch (e) { toast('复制失败，请手动选择文本复制', false); }
  document.body.removeChild(ta);
}

let llmCostFilter = { days: 30, page: 1 };
const LLM_PAGE_SIZE = 20;
async function renderLlmCost() {
  const qs = new URLSearchParams();
  qs.set('days', llmCostFilter.days);
  qs.set('page', llmCostFilter.page);
  qs.set('page_size', LLM_PAGE_SIZE);
  const d = await api('GET', '/api/llm/costs?' + qs.toString());
  const t = d.totals, p = d.prices;
  const daysSel = [0, 7, 30, 90].map(v =>
    `<option value="${v}" ${llmCostFilter.days === v ? 'selected' : ''}>${v === 0 ? '全部' : '最近 ' + v + ' 天'}</option>`).join('');
  const rows = d.rows.map(r => `
    <tr>
      <td class="muted">${esc(r.created_at)}</td>
      <td><b>${esc(r.username) || '—'}</b></td>
      <td><span class="tag neutral">${esc(r.entry)}</span></td>
      <td class="wrap">${esc(r.question)}</td>
      <td>${r.input.toLocaleString()}<span class="muted">（缓存 ${r.input_cached.toLocaleString()}）</span></td>
      <td>${r.output.toLocaleString()}</td>
      <td>${r.calls}</td>
      <td>${r.estimated ? '<span class="muted">≈</span>' : ''}</td>
      <td><b>${r.cost.toFixed(4)}</b> 元</td>
    </tr>`).join('');
  const totalPages = Math.max(1, d.total_pages);
  const cur = Math.min(d.page, totalPages);
  let pages = '';
  for (let i = 1; i <= totalPages; i++) {
    if (totalPages > 9 && i > 2 && i < totalPages - 1 && Math.abs(i - cur) > 1) {
      if (!pages.endsWith('…')) pages += '<span class="muted">…</span>';
      continue;
    }
    pages += `<button class="${i === cur ? 'current' : ''}" ${i === cur ? 'disabled' : ''}
      onclick="llmCostFilter.page = ${i}; renderLlmCost();">${i}</button>`;
  }
  const prev = `<button ${cur <= 1 ? 'disabled' : ''}
    onclick="llmCostFilter.page = ${cur - 1}; renderLlmCost();">‹ 上一页</button>`;
  const next = `<button ${cur >= totalPages ? 'disabled' : ''}
    onclick="llmCostFilter.page = ${cur + 1}; renderLlmCost();">下一页 ›</button>`;
  $('#view').innerHTML = `
    <h3>云端 LLM 消耗与费用（仅云上模型；本地模型不计费）</h3>
    <div class="cost-cards">
      <div class="cost-card"><div class="label">调用次数</div>
        <div class="value">${t.calls}</div></div>
      <div class="cost-card"><div class="label">输入 tokens</div>
        <div class="value">${t.input.toLocaleString()}</div>
        <div class="sub">其中命中缓存 ${t.input_cached.toLocaleString()}</div></div>
      <div class="cost-card"><div class="label">输出 tokens</div>
        <div class="value">${t.output.toLocaleString()}</div></div>
      <div class="cost-card highlight"><div class="label">总费用</div>
        <div class="value">${t.cost.toFixed(2)} 元</div></div>
    </div>
    <div style="display:flex; align-items:center; gap:16px; margin: 4px 0 10px;">
      <span>统计范围：
        <select onchange="llmCostFilter.days = parseInt(this.value); llmCostFilter.page = 1; renderLlmCost();">${daysSel}</select>
      </span>
      <span class="muted" style="margin-left:auto;">单价（元/百万 tokens）：
        输入 ${p.input} ｜ 命中缓存 ${p.input_cached} ｜ 输出 ${p.output}
        —— 在前台「模型配置」页修改</span>
    </div>
    <table class="data-table">
      <thead><tr>
        <th>时间</th><th>用户</th><th>入口</th><th>问题</th>
        <th>输入 tokens</th><th>输出 tokens</th><th>调用次数</th><th>估算</th><th>费用（元）</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="9" class="empty">所选范围内没有云端 LLM 消耗记录</td></tr>'}</tbody>
    </table>
    <div class="cost-page">
      ${prev}
      ${pages}
      ${next}
      <span class="info">第 ${cur} / ${totalPages} 页 ｜ 共 ${d.total_rows} 条记录</span>
    </div>`;
}

          <option value="">全部部门</option>
          ${(await api('GET', '/api/departments')).departments
            .map(x => `<option value="${esc(x.name)}" ${x.name === qaLogFilter.department
              ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select>
        <select onchange="qaLogFilter.username=this.value; qaLogFilter.page=1; renderQaLog()">
          <option value="">全部员工</option>
          ${users.map(u => `<option value="${esc(u.username)}" ${u.username === qaLogFilter.username
            ? 'selected' : ''}>${esc(u.username)}${u.real_name ? '（' + esc(u.real_name) + '）' : ''}</option>`).join('')}
        </select>
        <select onchange="qaLogFilter.entry=this.value; renderQaLog()">
          <option value="">全部入口</option>
          ${Object.keys(entryLabel).map(k =>
            `<option value="${k}" ${k === qaLogFilter.entry ? 'selected' : ''}>${entryLabel[k]}</option>`).join('')}
        </select>
        <button class="mini secondary" onclick="renderQaLog()">刷新</button>
      </div>
      <div class="muted" style="margin-bottom:10px">只有员工会产生使用记录（管理员不能登录前台/MCP）。
        记录所有入口的检索与提问，点击行展开回答全文、命中来源与生效的过滤条件（含部门权限域）。</div>
      <table><tr><th>时间</th><th>账户</th><th>部门</th><th>入口</th><th>问题</th><th>命中</th><th>耗时</th></tr>
      ${rows || `<tr><td colspan="7" class="empty">暂无使用记录</td></tr>`}</table>
      <div class="pager" style="display:flex;gap:8px;align-items:center;margin:10px 0 0">
        <button class="mini secondary" ${qaLogFilter.page <= 1 ? 'disabled' : ''}
          onclick="qaLogFilter.page--; renderQaLog()">上一页</button>
        <span class="muted">第 ${qaLogFilter.page} / ${totalPages} 页（共 ${d.total} 条）</span>
        <button class="mini secondary" ${qaLogFilter.page >= totalPages ? 'disabled' : ''}
          onclick="qaLogFilter.page++; renderQaLog()">下一页</button>
      </div>
    </div>`;
}

/* ---------- 启动 ---------- */
switchTab('dash');
// 部门下拉缓存：工作台快速入口「创建员工」不走员工管理页，启动时预取一次
api('GET', '/api/departments').then(d => { window._emp_deps = d.departments; }).catch(() => {});
</script>
</body>
</html>
